<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAR-10 Lab</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: system-ui, -apple-system, sans-serif; }

        body { 
            background: #06020c; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            padding: 15px;
        }

        .credit {
            position: absolute;
            top: 15px; left: 15px;
            color: #e1bee7; font-size: 11px; font-weight: 600;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px; border-radius: 20px;
            border: 1px solid rgba(186, 104, 200, 0.3);
        }

        .main-card {
            background: rgba(18, 10, 28, 0.95);
            border: 1.5px solid rgba(186, 104, 200, 0.4);
            border-radius: 20px;
            padding: 18px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 30px rgba(123, 31, 162, 0.35);
            width: 100%;
            max-width: 320px;
            position: relative;
        }

        .brand {
            color: #fff; font-weight: 800; letter-spacing: 3px;
            margin-bottom: 8px; font-size: 16px;
        }

        .chat-bubble {
            background: rgba(186, 104, 200, 0.15);
            border: 1px solid rgba(186, 104, 200, 0.4);
            color: #f3e5f5; padding: 6px 12px;
            border-radius: 12px; font-size: 12px; font-weight: 600;
            margin-bottom: 12px; text-align: center; width: 100%;
        }

        /* BANNER HELLO BERADA DI ATAS KEPALA ROBOT */
        .hello-banner {
            background: rgba(0, 240, 255, 0.15);
            border: 1px solid #00f0ff;
            color: #00f0ff;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 8px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
            transition: all 0.3s ease;
        }

        .hello-banner.hidden {
            display: none !important;
        }

        .robot-stage {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        .robot-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .robot-head {
            width: 130px; height: 95px;
            background: #190a2a;
            border: 3px solid #ba68c8; border-radius: 22px;
            position: relative; display: flex; align-items: center; justify-content: center;
        }

        .ear {
            width: 10px; height: 18px; background: #ba68c8;
            position: absolute; top: 50%; transform: translateY(-50%); border-radius: 4px;
        }
        .ear.left { left: -9px; } .ear.right { right: -9px; }

        .robot-screen {
            width: 95px; height: 60px; background: #06020c;
            border-radius: 14px; border: 2px solid rgba(186, 104, 200, 0.4);
            display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
        }

        .face-features { display: flex; gap: 14px; align-items: center; }

        .eye {
            width: 12px; height: 16px; background: #00f0ff;
            border-radius: 6px; box-shadow: 0 0 8px #00f0ff;
        }

        .robot-body {
            width: 75px; height: 30px;
            background: #10051d;
            border: 3px solid #ba68c8; border-top: none; border-radius: 0 0 16px 16px;
            margin-top: -3px;
        }

        .input-group { display: flex; width: 100%; gap: 6px; }
        input {
            flex: 1; background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(186, 104, 200, 0.3); border-radius: 8px;
            padding: 8px 10px; color: #fff; outline: none; font-size: 12px;
        }
        button {
            background: #9c27b0; border: none; color: #fff;
            font-weight: bold; padding: 8px 12px; border-radius: 8px; font-size: 12px;
        }
    </style>
</head>
<body onclick="hideHello()">

    <div class="credit">By Mario</div>

    <div class="main-card">
        <div class="brand">MAR-10</div>
        
        <div class="chat-bubble" id="bubble">System Ready</div>

        <div class="robot-stage">
            <!-- HELLO DIJAMIN TIDAK MENUMPUK MUKA -->
            <div class="hello-banner" id="helloBanner">HELLO!</div>

            <div class="robot-container" id="robot">
                <div class="robot-head">
                    <div class="ear left"></div>
                    <div class="robot-screen">
                        <div class="face-features" id="face">
                            <div class="eye"></div>
                            <div class="eye"></div>
                        </div>
                    </div>
                    <div class="ear right"></div>
                </div>
                <div class="robot-body"></div>
            </div>
        </div>

        <div class="input-group">
            <input type="text" id="userInput" placeholder="Say something...">
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        function hideHello() {
            const banner = document.getElementById('helloBanner');
            if (banner) {
                banner.classList.add('hidden');
            }
        }

        document.getElementById('robot').addEventListener('click', (e) => {
            e.stopPropagation();
            hideHello();
            document.getElementById('bubble').innerText = "Hello Mario!";
        });
    </script>
</body>
</html>
