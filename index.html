<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iron Man AR Experience</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; font-family: monospace; }
        .stage { position: relative; width: 100vw; height: 100vh; }
        video { display: none; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .hud-status {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #00f0ff;
            border: 1px solid rgba(0, 240, 255, 0.5);
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            font-size: 11px;
            letter-spacing: 1px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

<div class="stage">
    <div class="hud-status" id="hud">MARK VII // JARVIS ONLINE</div>
    <video id="webcam" autoplay playsinline></video>
    <canvas id="outputCanvas"></canvas>
</div>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const hud = document.getElementById('hud');

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- THREE.JS SCENE SETUP ---
    const scene = new THREE.Scene();
    const camera3D = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera3D.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);

    // Group Topeng Wajah Iron Man
    const ironHelmet = new THREE.Group();
    scene.add(ironHelmet);

    // Visor Kacamata Cyber / Iron Man HUD (Bentuk Lebih Ramping & Pas di Mata)
    const visorGeo = new THREE.CylinderGeometry(0.6, 0.5, 0.25, 16, 1, true, 0, Math.PI);
    const visorMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, side: THREE.DoubleSide, wireframe: true });
    const visorMesh = new THREE.Mesh(visorGeo, visorMat);
    visorMesh.rotation.y = Math.PI / 2;

    // Mata Glowing Cyan
    const eyeGeo = new THREE.PlaneGeometry(0.5, 0.08);
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
    const eyeMesh = new THREE.Mesh(eyeGeo, eyeMat);
    eyeMesh.position.set(0, 0, 0.2);

    ironHelmet.add(visorMesh);
    ironHelmet.add(eyeMesh);

    // Smooth Tracking (Lerp)
    let facePos = { x: 0, y: 0 };
    function lerp(a, b, n) { return (1 - n) * a + n * b; }

    function onFaceResults(results) {
        ctx.save();
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Render Kamera HD
        ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
            const face = results.multiFaceLandmarks[0];
            const nose = face[1]; // Posisi Hidung

            // Mapping posisi hidung ke koordinat 3D
            const targetX = (1 - nose.x) * (camera3D.aspect * 2.2) - (camera3D.aspect * 1.1);
            const targetY = -(nose.y * 2 - 1) * 1.5;

            facePos.x = lerp(facePos.x, targetX, 0.4);
            facePos.y = lerp(facePos.y, targetY, 0.4);

            ironHelmet.position.set(facePos.x, facePos.y, 0);
            ironHelmet.visible = true;

            hud.innerText = "MARK VII // TARGET LOCKED";
        } else {
            ironHelmet.visible = false;
            hud.innerText = "MARK VII // SEARCHING TARGET...";
        }

        renderer.render(scene, camera3D);
        ctx.drawImage(renderer.domElement, 0, 0);
        ctx.restore();
    }

    const faceMeshAI = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
    faceMeshAI.setOptions({ maxNumFaces: 1, minDetectionConfidence: 0.6 });
    faceMeshAI.onResults(onFaceResults);

    const camera = new Camera(video, {
        onFrame: async () => { await faceMeshAI.send({ image: video }); },
        width: 1280,
        height: 720
    });
    camera.start();
</script>
</body>
</html>
