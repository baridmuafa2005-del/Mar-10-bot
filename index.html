<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiderman AR</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        video { display: none; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    </style>
</head>
<body>
    <video id="webcam" autoplay playsinline></video>
    <canvas id="outputCanvas"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('outputCanvas');
        const ctx = canvas.getContext('2d', { alpha: true });
        
        const maskImg = new Image();
        // --- UBAH BAGIAN DI BAWAH INI SESUAI NAMA FILE KAMU ---
        maskImg.src = './9ac93edd597dbd203dc760cc425fa68a.jpg'; 
        // ----------------------------------------------------

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        function onResults(results) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const face = results.multiFaceLandmarks[0];
                const nose = face[1];
                const leftCheek = face[234];
                const rightCheek = face[454];

                const w = Math.hypot((rightCheek.x - leftCheek.x) * canvas.width, (rightCheek.y - leftCheek.y) * canvas.height);
                const maskWidth = w * 2.5; 
                const maskHeight = maskWidth * 1.4;

                ctx.save();
                ctx.translate(nose.x * canvas.width, nose.y * canvas.height - (maskHeight * 0.1));
                const angle = Math.atan2((rightCheek.y - leftCheek.y), (rightCheek.x - leftCheek.x));
                ctx.rotate(angle);

                if(maskImg.complete) {
                    ctx.drawImage(maskImg, -maskWidth/2, -maskHeight/2, maskWidth, maskHeight);
                }
                ctx.restore();
            }
        }

        const faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });
        faceMesh.onResults(onResults);

        new Camera(video, { onFrame: async () => { await faceMesh.send({ image: video }); }, width: 1280, height: 720 }).start();
    </script>
</body>
</html>
