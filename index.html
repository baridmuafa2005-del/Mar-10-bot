<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Gesture Detector - AR</title>
    <!-- MediaPipe Hands & Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body {
            background: #0f172a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 640px;
            height: 480px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        video {
            display: none; /* Video disembunyikan, diproses di canvas */
        }
        .output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1); /* Efek cermin supaya natural */
        }
        /* UI PENDETEKSI OBJEK DI ATAS LAYAR */
        .hud-display {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #38bdf8;
            color: #38bdf8;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.4);
            text-align: center;
        }
        .status-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
            color: #94a3b8;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="status-loading" id="loading">Memuat Kamera & Model AI...</div>
        <video id="webcam" autoplay playsinline></video>
        <canvas class="output_canvas" id="outputCanvas"></canvas>
        <div class="hud-display" id="hudText">TUNJUKKAN GESTUR TANGAN</div>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('outputCanvas');
        const canvasCtx = canvasElement.getContext('2d');
        const hudText = document.getElementById('hudText');
        const loading = document.getElementById('loading');

        function onResults(results) {
            loading.style.display = 'none';
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // Deteksi posisi jari (Tip vs MCP/PIP dasar jari)
                const thumbTip = landmarks[4];
                const indexTip = landmarks[8];
                const middleTip = landmarks[12];
                const ringTip = landmarks[16];
                const pinkyTip = landmarks[20];
                
                const wrist = landmarks[0];

                // Logika sederhana deteksi jari terangkat
                const isThumbOpen = thumbTip.x < landmarks[3].x; // Estimasi jempol
                const isIndexOpen = indexTip.y < landmarks[6].y;
                const isMiddleOpen = middleTip.y < landmarks[10].y;
                const isRingOpen = ringTip.y < landmarks[14].y;
                const isPinkyOpen = pinkyTip.y < landmarks[18].y;

                let detected = "MENCARI GESTUR...";

                // Pemetaan Gestur Kamu
                if (isIndexOpen && isMiddleOpen && isRingOpen && isPinkyOpen && !isThumbOpen) {
                    detected = "🌸 TANAMAN BUNGA (Jempol)";
                } else if (isIndexOpen && isMiddleOpen && !isRingOpen && !isPinkyOpen) {
                    detected = "🐉 NAGA (Peace / Dua Jari)";
                } else if (isIndexOpen && isMiddleOpen && isRingOpen && isPinkyOpen && isThumbOpen) {
                    detected = "🌲 POHON (Metal / I Love You)";
                } else if (isIndexOpen && !isMiddleOpen && !isRingOpen && !isPinkyOpen) {
                    detected = "🏠 RUMAH (Telunjuk)";
                }

                hudText.innerText = detected;
            } else {
                hudText.innerText = "TIDAK ADA TANGAN TERDETEKSI";
            }

            canvasCtx.restore();
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });

        camera.start().catch(err => {
            loading.innerText = "Gagal mengakses kamera! Pastikan izin kamera aktif.";
            console.error(err);
        });
    </script>
</body>
</html>
