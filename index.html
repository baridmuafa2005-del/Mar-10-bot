<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Hand Tracking - VFX</title>
    <!-- MediaPipe & Three.js Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #050505; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; font-family: sans-serif; }
        .stage { position: relative; width: 640px; height: 480px; border-radius: 12px; overflow: hidden; box-shadow: 0 0 40px rgba(0,255,200,0.2); }
        video { display: none; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); }
        .hud { position: absolute; top: 15px; left: 15px; font-size: 12px; font-family: monospace; color: #00ffcc; text-shadow: 0 0 5px #00ffcc; pointer-events: none; }
    </style>
</head>
<body>

<div class="stage">
    <div class="hud" id="hud">SYSTEM READY // WAITING FOR HAND GESTURE...</div>
    <video id="webcam" autoplay playsinline></video>
    <canvas id="outputCanvas"></canvas>
</div>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d');
    const hud = document.getElementById('hud');

    // --- THREE.JS 3D SCENE SETUP ---
    const scene = new THREE.Scene();
    const camera3D = new THREE.PerspectiveCamera(45, 640 / 480, 0.1, 1000);
    camera3D.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(640, 480);
    
    // Group Objek 3D + Bounding Box Wireframe
    const group3D = new THREE.Group();
    scene.add(group3D);

    // Bounding Box (Box Kawat khas VFX VFX)
    const boxGeo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
    const boxMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.5 });
    const wireframeBox = new THREE.Mesh(boxGeo, boxMat);
    group3D.add(wireframeBox);

    // Mesh Placeholder Objek 3D (Bisa diganti loader file .GLTF/.GLB nanti)
    let currentMesh = null;
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(1, 1, 2);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x404040));

    function set3DObject(type) {
        if(currentMesh) group3D.remove(currentMesh);

        let geo, mat;
        if(type === 'POHON') {
            geo = new THREE.CylinderGeometry(0.1, 0.6, 1.2, 8);
            mat = new THREE.MeshPhongMaterial({ color: 0x228b22, flatShading: true });
        } else if(type === 'BUNGA') {
            geo = new THREE.TorusKnotGeometry(0.4, 0.15, 100, 16);
            mat = new THREE.MeshPhongMaterial({ color: 0xff69b4 });
        } else if(type === 'NAGA') {
            geo = new THREE.OctahedronGeometry(0.6, 2);
            mat = new THREE.MeshPhongMaterial({ color: 0xff0000, wireframe: true });
        } else if(type === 'RUMAH') {
            geo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
            mat = new THREE.MeshPhongMaterial({ color: 0x38bdf8 });
        }

        if(geo) {
            currentMesh = new THREE.Mesh(geo, mat);
            group3D.add(currentMesh);
        }
    }

    // --- HAND TRACKING & LOGIC ---
    function onResults(results) {
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;

        ctx.save();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            const lm = results.multiHandLandmarks[0];

            // Posisi Telunjuk (Landmark 8)
            const x = (1 - lm[8].x) * 2 - 1; 
            const y = -(lm[8].y * 2 - 1);

            group3D.position.set(x * 2, y * 1.5, 0);
            group3D.rotation.y += 0.05; // Rotasi melayang
            group3D.visible = true;

            // Deteksi Jari
            const isIndex = lm[8].y < lm[6].y;
            const isMiddle = lm[12].y < lm[10].y;
            const isRing = lm[16].y < lm[14].y;
            const isPinky = lm[20].y < lm[18].y;
            const isThumb = lm[4].x < lm[3].x;

            let objType = "";
            if (isThumb && !isIndex && !isMiddle && !isRing && !isPinky) {
                objType = "BUNGA";
            } else if (isIndex && isMiddle && !isRing && !isPinky) {
                objType = "NAGA";
            } else if (isIndex && isPinky && isThumb) {
                objType = "POHON";
            } else if (isIndex && !isMiddle && !isRing && !isPinky) {
                objType = "RUMAH";
            }

            if(objType) {
                hud.innerText = `GESTURE DETECTED: [ ${objType} ]`;
                set3DObject(objType);
            }
        } else {
            group3D.visible = false;
            hud.innerText = "SEARCHING HAND...";
        }

        // Render 3D Overlay di atas Canvas Video
        renderer.render(scene, camera3D);
        ctx.drawImage(renderer.domElement, 0, 0);
        ctx.restore();
    }

    const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6 });
    hands.onResults(onResults);

    const camera = new Camera(video, {
        onFrame: async () => { await hands.send({ image: video }); },
        width: 640, height: 480
    });
    camera.start();
</script>
</body>
</html>
