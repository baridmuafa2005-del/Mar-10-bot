<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Custom Music Tiles</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #0f172a;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #setup-box {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .input-group {
            margin-top: 15px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 5px;
        }

        input[type="file"], select {
            width: 100%;
            padding: 10px;
            background: #334155;
            border: 1px solid #475569;
            color: white;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }

        .btn-play {
            width: 100%;
            background: #22c55e;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            margin-top: 20px;
            cursor: pointer;
        }

        #game-view {
            display: none;
            width: 100vw;
            height: 100vh;
            max-width: 400px;
            position: relative;
            background: #000;
        }

        canvas { width: 100%; height: 100%; display: block; }

        .controls {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 90px;
            display: flex;
            background: rgba(0,0,0,0.5);
        }

        .lane-btn {
            flex: 1;
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .lane-btn:active { background: rgba(56, 189, 248, 0.5); }
    </style>
</head>
<body>

<div id="setup-box">
    <h3>🎵 Custom Music Tiles</h3>
    
    <div class="input-group">
        <label>1. Pilih Lagu (MP3/WAV)</label>
        <input type="file" id="song-input" accept="audio/*">
    </div>

    <div class="input-group">
        <label>2. Kecepatan Tile</label>
        <select id="speed-select">
            <option value="3">Pelan</option>
            <option value="5" selected>Sedang</option>
            <option value="8">Cepat</option>
        </select>
    </div>

    <div class="input-group">
        <label>3. Tema Warna</label>
        <select id="theme-select">
            <option value="#38bdf8">Neon Blue</option>
            <option value="#f472b6">Sakura Pink</option>
            <option value="#fbbf24">Sunset Gold</option>
            <option value="#a855f7">Cyberpunk</option>
        </select>
    </div>

    <button class="btn-play" id="start-btn">MULAI GAME</button>
</div>

<div id="game-view">
    <canvas id="canvas" width="360" height="640"></canvas>
    <div class="controls">
        <div class="lane-btn" id="b0">←</div>
        <div class="lane-btn" id="b1">↑</div>
        <div class="lane-btn" id="b2">↓</div>
        <div class="lane-btn" id="b3">→</div>
    </div>
</div>

<audio id="audio-player"></audio>

<script>
    const songInput = document.getElementById('song-input');
    const startBtn = document.getElementById('start-btn');
    const audioPlayer = document.getElementById('audio-player');
    const setupBox = document.getElementById('setup-box');
    const gameView = document.getElementById('game-view');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let speed = 5;
    let themeColor = '#38bdf8';
    let tiles = [];
    let isRunning = false;

    songInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            audioPlayer.src = URL.createObjectURL(file);
        }
    });

    startBtn.onclick = () => {
        if (!songInput.files[0]) {
            alert('Pilih file lagu terlebih dahulu!');
            return;
        }

        speed = parseInt(document.getElementById('speed-select').value);
        themeColor = document.getElementById('theme-select').value;

        setupBox.style.display = 'none';
        gameView.style.display = 'block';

        audioPlayer.play();
        isRunning = true;
        
        // Buat tile secara berkala
        setInterval(() => {
            if(isRunning) {
                tiles.push({
                    lane: Math.floor(Math.random() * 4),
                    y: -60,
                    hit: false
                });
            }
        }, 600);

        requestAnimationFrame(loop);
    };

    function pressLane(lane) {
        for (let t of tiles) {
            if (t.lane === lane && !t.hit && t.y > 450 && t.y < 580) {
                t.hit = true;
                break;
            }
        }
    }

    [0, 1, 2, 3].forEach(lane => {
        const btn = document.getElementById('b' + lane);
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); pressLane(lane); });
        btn.addEventListener('mousedown', () => pressLane(lane));
    });

    function loop() {
        if (!isRunning) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Garis Pembatas
        ctx.strokeStyle = '#334155';
        for (let i = 1; i < 4; i++) {
            ctx.beginPath();
            ctx.moveTo(i * 90, 0);
            ctx.lineTo(i * 90, canvas.height);
            ctx.stroke();
        }

        // Garis Hit
        ctx.strokeStyle = '#ef4444';
        ctx.beginPath();
        ctx.moveTo(0, 520);
        ctx.lineTo(360, 520);
        ctx.stroke();

        // Render Tile
        tiles.forEach(t => {
            t.y += speed;
            if (!t.hit) {
                ctx.fillStyle = themeColor;
                ctx.fillRect(t.lane * 90 + 5, t.y, 80, 50);
            }
        });

        requestAnimationFrame(loop);
    }
</script>
</body>
</html>
