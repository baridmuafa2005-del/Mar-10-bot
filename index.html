<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAR-10 Lab System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: sans-serif; }

        body { 
            background: #040108; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            position: relative;
        }

        /* BACKGROUND RAMAI */
        .bg-grid {
            position: absolute; width: 200%; height: 200%;
            background-image: linear-gradient(rgba(186, 104, 200, 0.1) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(186, 104, 200, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(500px) rotateX(60deg);
            z-index: 0;
        }

        .lab-container {
            display: flex; align-items: center; justify-content: center;
            gap: 20px; z-index: 1; padding: 20px; flex-wrap: wrap;
        }

        /* ROBOT SAMPING (SCANNER & RADAR) */
        .side-robot {
            background: rgba(18, 10, 28, 0.8);
            border: 1px solid #00f0ff;
            border-radius: 15px; padding: 15px;
            display: flex; flex-direction: column; align-items: center;
            width: 100px;
        }

        /* ROBOT UTAMA MAR-10 */
        .main-card {
            background: rgba(18, 10, 28, 0.95);
            border: 1.5px solid rgba(186, 104, 200, 0.5);
            border-radius: 20px; padding: 20px;
            width: 280px; display: flex; flex-direction: column; align-items: center;
        }

        .hello-text { color: #00f0ff; font-weight: 800; margin-bottom: 10px; }
        .hidden { display: none; }

        .robot-head {
            width: 120px; height: 85px; background: #190a2a;
            border: 3px solid #ba68c8; border-radius: 20px;
            position: relative; display: flex; align-items: center; justify-content: center;
        }
        .robot-body { width: 60px; height: 25px; background: #190a2a; border: 3px solid #ba68c8; border-top: none; border-radius: 0 0 15px 15px; }
        .leg-container { display: flex; justify-content: space-between; width: 40px; margin-top: -2px; }
        .leg { width: 10px; height: 15px; background: #ba68c8; }

        .input-group { display: flex; width: 100%; gap: 5px; margin-top: 15px; }
        input { flex: 1; background: #000; border: 1px solid #555; padding: 8px; color: #fff; border-radius: 5px; }
        button { background: #9c27b0; border: none; color: #fff; padding: 8px 12px; border-radius: 5px; }
    </style>
</head>
<body onclick="hideHello()">
    <div class="bg-grid"></div>

    <div class="lab-container">
        <!-- SCANNER BOT KIRI -->
        <div class="side-robot">
            <div style="color: #00f0ff; font-size: 10px;">SCANNER</div>
            <div style="width: 40px; height: 40px; border: 2px solid #00f0ff; margin-top: 10px;"></div>
        </div>

        <!-- MAIN ROBOT -->
        <div class="main-card">
            <div id="helloText" class="hello-text">HELLO!</div>
            <div id="robot" class="robot-container">
                <div class="robot-head">
                    <div style="width: 80px; height: 50px; background: #000; border-radius: 10px;"></div>
                </div>
                <div class="robot-body"></div>
                <div class="leg-container"><div class="leg"></div><div class="leg"></div></div>
            </div>
            <div class="input-group">
                <input type="text" placeholder="Say...">
                <button>Send</button>
            </div>
        </div>

        <!-- RADAR BOT KANAN -->
        <div class="side-robot" style="border-color: #ab47bc;">
            <div style="color: #ab47bc; font-size: 10px;">RADAR</div>
            <div style="width: 40px; height: 40px; border-radius: 50%; border: 2px solid #ab47bc; margin-top: 10px;"></div>
        </div>
    </div>

    <script>
        function hideHello() { document.getElementById('helloText').classList.add('hidden'); }
        document.getElementById('robot').addEventListener('click', (e) => { e.stopPropagation(); hideHello(); });
    </script>
</body>
</html>
