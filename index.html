<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iron Man AR Experience</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; font-family: monospace; }
        .stage { position: relative; width: 100vw; height: 100vh; }
        video { display: none; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .hud-status {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #00f0ff;
            border: 1px solid rgba(0, 240, 255, 0.5);
            padding: 8px 14px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 4px;
            font-size: 11px;
            letter-spacing: 1px;
            pointer-events: none;
            z-index: 10;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }
    </style>
</head>
<body>

<div class="stage">
    <div class="hud-status" id="hud">MARK VII // JARVIS ONLINE</div>
    <video id="webcam" autoplay playsinline></video>
    <canvas id="outputCanvas"></canvas>
</div>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const hud = document.getElementById('hud');

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function onResults(results) {
        ctx.save();
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Gambar Video Kamera HD
        ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
            const face = results.multiFaceLandmarks[0];
            const w = canvas.width;
            const h = canvas.height;

            // --- 2. BINGKAI VISOR TOPENG IRON MAN (MERAH / KUNING CYBER) ---
            ctx.beginPath();
            // Garis Luar Dahi & Pipi
            ctx.moveTo(face[70].x * w, face[70].y * h);
            ctx.lineTo(face[300].x * w, face[300].y * h);
            ctx.lineTo(face[293].x * w, face[293].y * h);
            ctx.lineTo(face[356].x * w, face[356].y * h);
            ctx.lineTo(face[127].x * w, face[127].y * h);
            ctx.lineTo(face[63].x * w, face[63].y * h);
            ctx.closePath();

            ctx.fillStyle = 'rgba(255, 30, 0, 0.18)';
            ctx.fill();
            ctx.strokeStyle = '#ff3300';
            ctx.lineWidth = 2.5;
            ctx.shadowColor = '#ff3300';
            ctx.shadowBlur = 8;
            ctx.stroke();

            // --- 3. MATA IRON MAN GLOWING CYAN (MATA KIRI & KANAN) ---
            ctx.shadowColor = '#00ffff';
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#00ffff';

            // Mata Kiri
            ctx.beginPath();
            ctx.moveTo(face[33].x * w, face[33].y * h);
            ctx.lineTo(face[160].x * w, face[160].y * h);
            ctx.lineTo(face[158].x * w, face[158].y * h);
            ctx.lineTo(face[133].x * w, face[133].y * h);
            ctx.lineTo(face[153].x * w, face[153].y * h);
            ctx.lineTo(face[144].x * w, face[144].y * h);
            ctx.closePath();
            ctx.fill();

            // Mata Kanan
            ctx.beginPath();
            ctx.moveTo(face[362].x * w, face[362].y * h);
            ctx.lineTo(face[385].x * w, face[385].y * h);
            ctx.lineTo(face[387].x * w, face[387].y * h);
            ctx.lineTo(face[263].x * w, face[263].y * h);
            ctx.lineTo(face[373].x * w, face[373].y * h);
            ctx.lineTo(face[380].x * w, face[380].y * h);
            ctx.closePath();
            ctx.fill();

            // --- 4. LINGKARAN HUD JARVIS DI DAHI ---
            ctx.shadowBlur = 0;
            const centerX = face[1].x * w;
            const centerY = face[1].y * h;

            ctx.beginPath();
            ctx.arc(centerX, centerY - 50, 35, 0, Math.PI * 2);
            ctx.strokeStyle = '#00f0ff';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([5, 5]);
            ctx.stroke();
            ctx.setLineDash([]); // Reset line dash

            hud.innerText = "MARK VII // TARGET LOCKED";
        } else {
            hud.innerText = "MARK VII // SEARCHING TARGET...";
        }

        ctx.restore();
    }

    const faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6
    });

    faceMesh.onResults(onResults);

    const camera = new Camera(video, {
        onFrame: async () => { await faceMesh.send({ image: video }); },
        width: 1280,
        height: 720
    });
    camera.start();
</script>
</body>
</html>
