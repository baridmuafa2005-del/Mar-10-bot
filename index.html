<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Custom Music Rhythm Tiles</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #setup-screen, #result-screen {
            text-align: center;
            background: rgba(10, 15, 30, 0.9);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(0,191,255,0.3);
            max-width: 360px;
            width: 90%;
            border: 1px solid #38bdf8;
            z-index: 30;
        }

        #result-screen { display: none; }

        input[type="file"] { display: none; }
        
        .btn-select-song {
            background: #0284c7;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            margin-top: 15px;
            display: inline-block;
            box-shadow: 0 0 10px rgba(2, 132, 199, 0.5);
        }

        .option-group { margin-top: 15px; }
        .option-label { font-size: 12px; color: #cbd5e1; margin-bottom: 8px; font-weight: bold; }

        .diff-container { display: flex; justify-content: center; gap: 8px; }

        .opt-btn {
            background: #1e293b;
            color: #fff;
            border: 1px solid #334155;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            flex: 1;
        }
        .opt-btn.active {
            background: #38bdf8;
            color: #000;
            border-color: #38bdf8;
            box-shadow: 0 0 10px #38bdf8;
        }

        #start-btn {
            background: #10b981;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            width: 100%;
            margin-top: 20px;
            cursor: pointer;
            display: none;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
        }

        /* Container Persis Seperti di Video */
        #game-container {
            display: none;
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 380px;
            max-height: 640px;
            background: url('bg.jpg') center/cover no-repeat #000;
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
        }

        /* Dark Overlay tipis di atas gambar bg.jpg */
        #game-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.45);
            pointer-events: none;
            z-index: 1;
        }

        canvas { display: block; width: 100%; height: 100%; position: relative; z-index: 2; }

        /* Signature "By Mario" Persis Seperti Video */
        .signature {
            position: absolute;
            top: 12px;
            right: 20px;
            font-family: 'Great Vibes', cursive;
            font-size: 32px;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(0,0,0,0.9), 0 0 15px #38bdf8;
            z-index: 10;
            pointer-events: none;
        }

        #score-board {
            position: absolute;
            top: 16px;
            left: 20px;
            font-size: 16px;
            font-weight: bold;
            font-family: Arial, sans-serif;
            color: #ffffff;
            text-shadow: 0 0 8px #000, 0 0 12px #38bdf8;
            z-index: 10;
        }

        /* Tampilan Hit Rating (PERFECT, GREAT, GOOD, MISS) & Combo */
        #combo-hud {
            position: absolute;
            top: 42%;
            width: 100%;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            pointer-events: none;
            z-index: 10;
        }

        #hit-text {
            font-size: 26px;
            font-weight: 900;
            color: #38bdf8;
            text-shadow: 0 0 10px #000, 0 0 15px #38bdf8;
            opacity: 0;
            transition: opacity 0.15s ease, transform 0.1s ease;
        }

        #combo-count {
            font-size: 16px;
            color: #fbbf24;
            text-shadow: 0 0 8px #000;
            margin-top: 4px;
            opacity: 0;
        }

        .key-hints {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 75px;
            display: flex;
            background: rgba(0, 0, 0, 0.7);
            border-top: 1.5px solid rgba(255, 255, 255, 0.25);
            z-index: 10;
        }

        .key-box {
            flex: 1;
            border-right: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            color: #fff;
            touch-action: manipulation;
        }
        .key-box:last-child { border-right: none; }

        .key-box.active {
            background: rgba(56, 189, 248, 0.5);
            box-shadow: inset 0 0 15px #38bdf8;
        }

        .stat-list {
            text-align: left;
            margin: 15px 0;
            font-size: 14px;
            line-height: 1.8;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

<div id="setup-screen">
    <h2>🎵 Custom Music Rhythm Tiles</h2>
    <p style="margin-top:6px; font-size:12px; color:#aaa;">Pilih lagu favoritmu!</p>
    
    <label class="btn-select-song">
        📁 Pilih File Audio
        <input type="file" id="audio-input" accept="audio/*">
    </label>
    <div id="file-name" style="margin-top:8px; font-size:12px; color:#38bdf8; font-weight:bold;"></div>

    <div class="option-group">
        <div class="option-label">Kecepatan Tile:</div>
        <div class="diff-container">
            <button class="opt-btn diff-btn active" data-speed="4">Pelan</button>
            <button class="opt-btn diff-btn" data-speed="6">Sedang</button>
            <button class="opt-btn diff-btn" data-speed="8">Cepat</button>
        </div>
    </div>
    
    <button id="start-btn">MULAI GAME 🚀</button>
</div>

<div id="result-screen">
    <h2>🎉 RESULT</h2>
    <div class="stat-list">
        <div>Score: <b id="res-score" style="color:#fff;">0</b></div>
        <div>Perfect: <b id="res-perfect" style="color:#34d399;">0</b></div>
        <div>Great: <b id="res-great" style="color:#38bdf8;">0</b></div>
        <div>Good: <b id="res-good" style="color:#fbbf24;">0</b></div>
        <div>Miss: <b id="res-miss" style="color:#ef44
