<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAR-10 - Next Gen AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background-color: #060408; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            position: relative;
        }

        /* Background Dinamis dengan Efek Bernapas */
        .bg-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('file_00000000b81c820796f02e3609...'); /* Sesuaikan nama file background di GitHub kamu */
            background-size: cover;
            background-position: center;
            filter: brightness(0.15) contrast(1.4) hue-rotate(250deg) blur(3px);
            z-index: 1;
            animation: bgPulse 8s infinite alternate ease-in-out;
        }

        @keyframes bgPulse {
            0% { transform: scale(1); filter: brightness(0.12) contrast(1.3) hue-rotate(250deg) blur(3px); }
            100% { transform: scale(1.05); filter: brightness(0.18) contrast(1.5) hue-rotate(260deg) blur(3px); }
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(25,10,35,0.4) 0%, rgba(4,2,8,0.92) 100%);
            z-index: 2;
        }

        .main-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        /* Judul Brand dengan Efek Neon Berdenyut */
        .brand-title {
            color: #ffffff;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 6px;
            margin-bottom: 12px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(186, 104, 200, 0.8), 0 0 25px rgba(123, 31, 162, 0.6);
            animation: titleGlow 3s infinite alternate ease-in-out;
        }

        @keyframes titleGlow {
            0% { text-shadow: 0 0 8px rgba(186, 104, 200, 0.6), 0 0 20px rgba(123, 31, 162, 0.4); }
            100% { text-shadow: 0 0 15px rgba(224, 64, 251, 1), 0 0 35px rgba(186, 104, 200, 0.8); }
        }

        .chat-bubble {
            background: rgba(18, 10, 28, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(186, 104, 200, 0.3);
            color: #f3e5f5;
            padding: 12px 18px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 22px;
            box-shadow: 0 8px 30px rgba(123, 31, 162, 0.25);
            text-align: center;
            max-width: 90%;
            transition: all 0.3s ease;
        }

        /* Wrapper Robot dengan Efek Melayang (Floating Animation) */
        .robot-wrapper {
            width: 260px;
            height: 330px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 22px;
            perspective: 1000px;
            animation: floatRobot 4s infinite ease-in-out;
        }

        @keyframes floatRobot {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .robot-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 24px;
            /* Efek Neon Glow Ungu Hidup di Sekeliling Gambar Robot */
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.9), 0 0 25px rgba(186, 104, 200, 0.4), inset 0 0 15px rgba(186, 104, 200, 0.2);
            border: 1px solid rgba(186, 104, 200, 0.5);
            transition: transform 0.1s ease-out, box-shadow 0.3s ease;
            will-change: transform;
        }

        .robot-image:hover {
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.95), 0 0 35px rgba(224, 64, 251, 0.7);
        }

        .input-box-container {
            display: flex;
            width: 100%;
            background: rgba(15, 8, 22, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(186, 104, 200, 0.35);
            border-radius: 14px;
            padding: 5px;
            box-shadow: 0 8px 25px rgba(123, 31, 162, 0.2);
            transition: all 0.3s ease;
        }

        .input-box-container:focus-within {
            border-color: rgba(224, 64, 251, 0.8);
            box-shadow: 0 0 20px rgba(186, 104, 200, 0.5);
        }

        .name-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 14px;
            padding: 10px 14px;
        }

        .name-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .submit-btn {
            background: linear-gradient(135deg, #ab47bc, #7b1fa2);
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(123, 31, 162, 0.4);
            transition: all 0.2s ease;
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, #ba68c8, #8e24aa);
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(186, 104, 200, 0.6);
        }

        .credit {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            color: rgba(243, 229, 245, 0.75);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            background: rgba(20, 10, 30, 0.5);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(186, 104, 200, 0.2);
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <div class="credit">By Mario</div>
    <div class="bg-layer"></div>
    <div class="overlay"></div>

    <div class="main-container">
        <div class="brand-title">MAR-10</div>
        
        <div class="chat-bubble" id="chatBubble">
            System Online. What's your name?
        </div>

        <div class="robot-wrapper">
            <img src="file_000000008a0c8207914d567c9bf5127b.png" alt="MAR-10 Robot" class="robot-image" id="robotImage">
        </div>

        <div class="input-box-container">
            <input type="text" class="name-input" id="userNameInput" placeholder="Enter your name..." autocomplete="off">
            <button class="submit-btn" id="submitBtn">Send</button>
        </div>
    </div>

    <script>
        const robotImage = document.getElementById('robotImage');
        const chatBubble = document.getElementById('chatBubble');
        const userNameInput = document.getElementById('userNameInput');
        const submitBtn = document.getElementById('submitBtn');

        // Interaksi kursor 3D tilt yang responsif mengikuti arah mouse/sentuhan layar HP
        function moveRobot(clientX, clientY) {
            const xPos = (window.innerWidth / 2 - clientX) / 15;
            const yPos = (window.innerHeight / 2 - clientY) / 15;
            robotImage.style.transform = `rotateY(${xPos}deg) rotateX(${-yPos}deg) scale(1.03)`;
        }

        document.addEventListener('mousemove', (e) => moveRobot(e.clientX, e.clientY));
        document.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) {
                moveRobot(e.touches[0].clientX, e.touches[0].clientY);
            }
        });

        document.addEventListener('mouseleave', () => {
            robotImage.style.transform = `rotateY(0deg) rotateX(0deg) scale(1)`;
        });

        // Fitur sapaan interaktif saat pengguna memasukkan nama
        function handleNameSubmit() {
            const val = userNameInput.value.trim();
            if (val !== "") {
                chatBubble.style.opacity = 0;
                setTimeout(() => {
                    chatBubble.innerText = `Hi ${val}, MAR-10 ready for assistance.`;
                    chatBubble.style.opacity = 1;
                }, 250);
                userNameInput.value = "";
                userNameInput.blur();
            }
        }

        submitBtn.addEventListener('click', handleNameSubmit);
        userNameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleNameSubmit();
        });
    </script>
</body>
</html>
