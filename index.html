<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Custom Music Rhythm Tiles - By Mario</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            background: #09090b;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #setup-screen, #result-screen {
            text-align: center;
            background: rgba(30, 41, 59, 0.95);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            max-width: 400px;
            width: 90%;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
            z-index: 20;
        }

        #result-screen { display: none; }

        input[type="file"] { display: none; }
        
        .btn {
            background: #3b82f6;
            color: white;
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            display: inline-block;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            transition: all 0.2s ease;
        }
        .btn:active { transform: scale(0.95); }

        .diff-container {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .diff-btn {
            background: #334155;
            color: #94a3b8;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .diff-btn.active {
            background: #38bdf8;
            color: #0f172a;
            box-shadow: 0 0 10px #38bdf8;
        }

        #game-container {
            display: none;
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 400px;
            max-height: 680px;
            background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)), url('bg.jpg');
            background-size: cover;
            background-position: center;
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        /* Fever Mode Aura */
        #game-container.fever {
            border-color: #f43f5e;
            box-shadow: 0 0 35px #f43f5e;
        }

        #game-container.shake {
            animation: hitShake 0.08s ease-in-out;
        }

        @keyframes hitShake {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-3px, 2px); }
            50% { transform: translate(3px, -2px); }
            75% { transform: translate(-2px, -1px); }
            100% { transform: translate(0, 0); }
        }

        canvas { display: block; width: 100%; height: 100%; }

        .signature {
            position: absolute;
            top: 12px;
            right: 16px;
            font-family: 'Great Vibes', cursive;
            font-size: 26px;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8), 0 0 15px rgba(56, 189, 248, 0.6);
            z-index: 10;
            pointer-events: none;
        }

        #score-board {
            position: absolute;
            top: 14px;
            left: 16px;
            font-size: 15px;
            font-weight: bold;
            text-shadow: 0 2px 4px #000;
            z-index: 10;
        }

        #combo-hud {
            position: absolute;
            top: 18%;
            width: 100%;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            pointer-events: none;
            z-index: 10;
        }

        #hit-text {
            font-size: 24px;
            font-weight: 900;
            color: #38bdf8;
            text-shadow: 0 0 12px #38bdf8;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        #combo-count {
            font-size: 18px;
            color: #fbbf24;
            text-shadow: 0 0 10px #fbbf24;
            margin-top: 4px;
            opacity: 0;
        }

        #fever-banner {
            font-size: 20px;
            font-weight: 900;
            color: #f43f5e;
            text-shadow: 0 0 15px #f43f5e;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .key-hints {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 85px;
            display: flex;
            background: rgba(0, 0, 0, 0.65);
            border-top: 2px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            z-index: 10;
        }

        .key-box {
            flex: 1;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #e2e8f0;
            touch-action: manipulation;
            transition: background 0.05s ease, box-shadow 0.05s ease, transform 0.05s ease;
        }
        .key-box:last-child { border-right: none; }

        .key-box.active {
            background: rgba(56, 189, 248, 0.45);
            box-shadow: 0 0 25px #38bdf8, inset 0 0 15px #ffffff;
            color: #ffffff;
            text-shadow: 0 0 10px #ffffff, 0 0 20px #38bdf8;
            transform: translateY(2px);
        }

        .rank-badge {
            font-family: 'Orbitron', sans-serif;
            font-size: 50px;
            font-weight: 900;
            color: #fbbf24;
            text-shadow: 0 0 20px #fbbf24;
            margin: 10px 0;
        }
        
        .stat-list {
            text-align: left;
            margin: 15px 0;
            font-size: 14px;
            line-height: 1.8;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

<div id="setup-screen">
    <h2>🎵 Custom Music Tiles</h2>
    <p style="margin-top:10px; font-size:14px; color:#94a3b8;">Import lagu MP3/WAV dari perangkat kamu!</p>
    
    <label class="btn" style="margin-top:20px;">
        Pilih Lagu
        <input type="file" id="audio-input" accept="audio/*">
    </label>
    <div id="file-name" style="margin-top:10px; font-size:12px; color:#38bdf8;"></div>

    <p style="margin-top:15px; font-size:12px; color:#64748b;">Kecepatan Tile:</p>
    <div class="diff-container">
        <button class="diff-btn active" data-speed="350">Pelan</button>
        <button class="diff-btn" data-speed="480">Sedang</button>
        <button class="diff-btn" data-speed="620">Cepat</button>
    </div>
    
    <button class="btn" id="start-btn" style="display:none; background:#22c55e;">Mulai Game</button>
</div>

<div id="result-screen">
    <h2>🎉 GAME FINISHED</h2>
    <div class="rank-badge" id="res-rank">S</div>
    <div class="stat-list">
        <div>Score: <b id="res-score" style="color:#fff;">0</b></div>
        <div>High Score: <b id="res-high-score" style="color:#38bdf8;">0</b></div>
        <div>Perfect: <b id="res-perfect" style="color:#34d399;">0</b></div>
        <div>Great: <b id="res-great" style="color:#38bdf8;">0</b></div>
        <div>Miss: <b id="res-miss" style="color:#ef4444;">0</b></div>
        <div>Max Combo: <b id="res-combo" style="color:#fbbf24;">0x</b></div>
    </div>
</div>

<div id="game-container">
    <div id="score-board">
        Score: <span id="score">0</span><br>
        <small style="color:#94a3b8;">High: <span id="hi-score">0</span></small>
    </div>
    <div class="signature">By Mario</div>
    
    <div id="combo-hud">
        <div id="fever-banner">🔥 FEVER MODE 🔥</div>
        <div id="hit-text">PERFECT</div>
        <div id="combo-count">0x COMBO</div>
    </div>

    <canvas id="gameCanvas" width="360" height="600"></canvas>
    
    <div class="key-hints">
        <div class="key-box" id="k-Left" data-lane="0">←</div>
        <div class="key-box" id="k-Up" data-lane="1">↑</div>
        <div class="key-box" id="k-Down" data-lane="2">↓</div>
        <div class="key-box" id="k-Right" data-lane="3">→</div>
    </div>
</div>

<script>
    const audioInput = document.getElementById('audio-input');
    const startBtn = document.getElementById('start-btn');
    const fileNameDiv = document.getElementById('file-name');
    const setupScreen = document.getElementById('setup-screen');
    const resultScreen = document.getElementById('result-screen');
    const gameContainer = document.getElementById('game-container');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hitText = document.getElementById('hit-text');
    const comboCount = document.getElementById('combo-count');
    const feverBanner = document.getElementById('fever-banner');

    let audioCtx, analyser, audioBuffer, audioSource;
    let freqData;
    let tiles = [];
    let score = 0, combo = 0, maxCombo = 0;
    let countPerfect = 0, countGreat = 0, countMiss = 0;
    let isPlaying = false;
    let startTime = 0;
    let gameSpeed = 350;
    let isFever = false;
    let highScore = localStorage.getItem('rhythm_hi_score') || 0;

    document.getElementById('hi-score').innerText = highScore;

    let activeLanes = [false, false, false, false];

    let bgParticles = [];
    for (let i = 0; i < 20; i++) {
        bgParticles.push({
            x: Math.random() * 360,
            y: Math.random() * 600,
            radius: Math.random() * 2 + 0.8,
            alpha: Math.random() * 0.7 + 0.3,
            speedY: Math.random() * 0.4 + 0.1,
            pulse: Math.random() * 0.02 + 0.005
        });
    }

    let hitParticles = [];

    const keyMap = { 'ArrowLeft': 0, 'ArrowUp': 1, 'ArrowDown': 2, 'ArrowRight': 3 };
    const keyBoxes = [
        document.getElementById('k-Left'), document.getElementById('k-Up'),
        document.getElementById('k-Down'), document.getElementById('k-Right')
    ];

    document.querySelectorAll('.diff-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            gameSpeed = parseInt(btn.getAttribute('data-speed'));
        });
    });

    audioInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            fileNameDiv.innerText = file.name;
            startBtn.style.display = 'inline-block';
            
            const reader = new FileReader();
            reader.onload = function(evt) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                audioCtx.decodeAudioData(evt.target.result, (buffer) => {
                    audioBuffer = buffer;
                });
            };
            reader.readAsArrayBuffer(file);
        }
    });

    function triggerVibrate(pattern) {
        if (navigator.vibrate) navigator.vibrate(pattern);
    }

    function playHitSFX(isPerfect) {
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(isPerfect ? 587.33 : 440, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
    }

    function generateTilesFromAudio(buffer) {
        const data = buffer.getChannelData(0);
        const sampleRate = buffer.sampleRate;
        const step = Math.floor(sampleRate / 10);
        let generatedTiles = [];

        for (let i = 0; i < data.length; i += step) {
            let sum = 0;
            for (let j = 0; j < step && (i + j) < data.length; j++) {
                sum += Math.abs(data[i + j]);
            }
            let average = sum / step;

            if (average > 0.18) { 
                let lane = Math.floor(Math.random() * 4);
                let time = i / sampleRate; 
                let isHold = average > 0.35; // Tile Panjang jika audio cukup kuat
                let length = isHold ? Math.min(average * 500, 260) : 80;

                let lastTile = generatedTiles[generatedTiles.length - 1];
                if (!lastTile || (time - lastTile.time > 0.28)) {
                    generatedTiles.push({
                        lane: lane, time: time, length: length, isHold: isHold,
                        y: -length, hit: false, missed: false, holding: false, holdProgress: 0
                    });
                }
            }
        }
        return generatedTiles;
    }

    startBtn.addEventListener('click', () => {
        if (!audioBuffer) return;
        setupScreen.style.display = 'none';
        gameContainer.style.display = 'block';

        tiles = generateTilesFromAudio(audioBuffer);
        
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;
        freqData = new Uint8Array(analyser.frequencyBinCount);

        audioSource = audioCtx.createBufferSource();
        audioSource.buffer = audioBuffer;
        audioSource.connect(analyser);
        analyser.connect(audioCtx.destination);
        
        startTime = audioCtx.currentTime;
        audioSource.start(0);
        isPlaying = true;

        audioSource.onended = showResult;

        requestAnimationFrame(gameLoop);
    });

    window.addEventListener('keydown', (e) => {
        if (keyMap.hasOwnProperty(e.key)) triggerHit(keyMap[e.key]);
    });

    window.addEventListener('keyup', (e) => {
        if (keyMap.hasOwnProperty(e.key)) {
            let lane = keyMap[e.key];
            keyBoxes[lane].classList.remove('active');
            activeLanes[lane] = false;
            releaseHold(lane);
        }
    });

    keyBoxes.forEach((box) => {
        const lane = parseInt(box.getAttribute('data-lane'));
        box.addEventListener('touchstart', (e) => {
            e.preventDefault();
            triggerHit(lane);
        }, { passive: false });

        box.addEventListener('touchend', (e) => {
            e.preventDefault();
            keyBoxes[lane].classList.remove('active');
            activeLanes[lane] = false;
            releaseHold(lane);
        }, { passive: false });
    });

    function spawnHitBurst(x, y) {
        let colorTheme = isFever ? '#f43f5e' : '#38bdf8';
        for (let i = 0; i < 12; i++) {
            hitParticles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
                radius: Math.random() * 3 + 2, alpha: 1,
                color: i % 2 === 0 ? colorTheme : '#ffffff'
            });
        }
    }

    function triggerHit(lane) {
        keyBoxes[lane].classList.add('active');
        activeLanes[lane] = true;
        const hitZoneY = 520;

        gameContainer.classList.remove('shake');
        void gameContainer.offsetWidth;
        gameContainer.classList.add('shake');

        tiles.forEach(tile => {
            if (tile.lane === lane && !tile.hit && !tile.missed) {
                let hitOffset = Math.abs((tile.y + tile.length) - hitZoneY);
                
                if (hitOffset <= 70) {
                    if (tile.isHold) {
                        tile.holding = true;
                    } else {
                        tile.hit = true;
                    }

                    combo++;
                    if (combo > maxCombo) maxCombo = combo;

                    // Fever Mode Streak (Combo >= 15)
                    if (combo >= 15 && !isFever) {
                        isFever = true;
                        gameContainer.classList.add('fever');
                        feverBanner.style.opacity = '1';
                        triggerVibrate([50, 50, 50]);
                    }

                    let isPerfect = hitOffset <= 30;
                    if (isPerfect) countPerfect++; else countGreat++;

                    let multiplier = isFever ? 2 : 1;
                    let points = (isPerfect ? 150 : 80) * multiplier;
                    score += points + (combo * 5);
                    
                    document.getElementById('score').innerText = score;
                    showFeedback(isPerfect ? 'PERFECT!' : 'GREAT!', isPerfect ? '#38bdf8' : '#34d399');
                    playHitSFX(isPerfect);
                    triggerVibrate(isPerfect ? 30 : 15);
                    spawnHitBurst(lane * 90 + 45, hitZoneY);
                }
            }
        });
    }

    function releaseHold(lane) {
        tiles.forEach(tile => {
            if (tile.lane === lane && tile.isHold && tile.holding && !tile.hit) {
                tile.holding = false;
                if (tile.holdProgress >= tile.length - 20) {
                    tile.hit = true;
                } else {
                    tile.missed = true;
                    resetCombo();
                }
            }
        });
    }

    function resetCombo() {
        combo = 0;
        isFever = false;
        gameContainer.classList.remove('fever');
        feverBanner.style.opacity = '0';
        comboCount.style.opacity = '0';
    }

    function showFeedback(text, color) {
        hitText.innerText = text;
        hitText.style.color = color;
        hitText.style.textShadow = `0 0 12px ${color}`;
        hitText.style.opacity = '1';

        if (combo > 1) {
            comboCount.innerText = `${combo}x COMBO`;
            comboCount.style.opacity = '1';
        }

        setTimeout(() => { hitText.style.opacity = '0'; }, 300);
    }

    function showResult() {
        isPlaying = false;
        gameContainer.style.display = 'none';
        resultScreen.style.display = 'block';

        if (score > highScore) {
            highScore = score;
            localStorage.setItem('rhythm_hi_score', highScore);
        }

        let rank = 'C';
        if (countMiss === 0 && countGreat === 0) rank = 'SS';
        else if (countMiss === 0) rank = 'S';
        else if (countPerfect > countMiss * 3) rank = 'A';
        else if (countPerfect > countMiss) rank = 'B';

        document.getElementById('res-rank').innerText = rank;
        document.getElementById('res-score').innerText = score;
        document.getElementById('res-high-score').innerText = highScore;
        document.getElementById('res-perfect').innerText = countPerfect;
        document.getElementById('res-great').innerText = countGreat;
        document.getElementById('res-miss').innerText = countMiss;
        document.getElementById('res-combo').innerText = `${maxCombo}x`;
    }

    function gameLoop() {
        if (!isPlaying) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Render Audio Visualizer (Waveform Bottom Bar)
        if (analyser) {
            analyser.getByteFrequencyData(freqData);
            ctx.fillStyle = isFever ? 'rgba(244, 63, 94, 0.25)' : 'rgba(56, 189, 248, 0
