<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAR-10 AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', sans-serif; }
        
        body { 
            background: #090510; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            position: relative;
        }

        .credit {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #e1bee7;
            font-size: 13px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(186, 104, 200, 0.2);
        }

        .main-card {
            background: rgba(18, 10, 26, 0.75);
            border: 1px solid rgba(186, 104, 200, 0.25);
            border-radius: 24px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(16px);
            max-width: 350px;
            width: 90%;
        }

        .brand {
            color: #fff;
            font-weight: 800;
            letter-spacing: 4px;
            margin-bottom: 14px;
            text-shadow: 0 0 10px #ab47bc;
        }

        .chat-bubble {
            background: rgba(186, 104, 200, 0.12);
            border: 1px solid rgba(186, 104, 200, 0.3);
            color: #f3e5f5;
            padding: 10px 16px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 16px;
            text-align: center;
            transition: all 0.2s ease;
        }

        /* FRAME ROBOT TANPA KOTAK KAKU */
        .robot-stage {
            width: 220px;
            height: 220px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
            overflow: hidden;
            border-radius: 16px;
        }

        .robot-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Trik buang background abu-abu/terang dari gambar */
            mix-blend-mode: lighten; 
            transition: transform 0.1s ease-out;
            will-change: transform;
            cursor: pointer;
        }

        .input-group {
            display: flex;
            width: 100%;
            gap: 8px;
        }

        input {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(186, 104, 200, 0.25);
            border-radius: 12px;
            padding: 10px 14px;
            color: #fff;
            outline: none;
            font-size: 13px;
        }

        button {
            background: linear-gradient(135deg, #ab47bc, #7b1fa2);
            border: none;
            color: #fff;
            font-weight: bold;
            padding: 10px 16px;
            border-radius: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="credit">By Mario</div>

    <div class="main-card">
        <div class="brand">MAR-10</div>
        
        <div class="chat-bubble" id="bubble">Need something, Mario?</div>

        <div class="robot-stage">
            <img src="file_000000008a0c8207914d567c9bf5127b.png" class="robot-img" id="robot" alt="MAR-10 Robot">
        </div>

        <div class="input-group">
            <input type="text" id="userInput" placeholder="Say something..." autocomplete="off">
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        const robot = document.getElementById('robot');
        const bubble = document.getElementById('bubble');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // Pergerakan diganti jadi geser halus (Parallax), bukan diputer miring kaku
        window.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.clientX) / 25;
            const y = (window.innerHeight / 2 - e.clientY) / 25;
            robot.style.transform = `translate(${-x}px, ${-y}px) scale(1.05)`;
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                const x = (window.innerWidth / 2 - e.touches[0].clientX) / 25;
                const y = (window.innerHeight / 2 - e.touches[0].clientY) / 25;
                robot.style.transform = `translate(${-x}px, ${-y}px) scale(1.05)`;
            }
        });

        const dialogs = [
            "MAR-10 Online & Tracking!",
            "Ouch! Don't touch my head!",
            "Need something, Mario?",
            "System operational ⚡"
        ];
        let idx = 0;

        robot.addEventListener('click', () => {
            idx = (idx + 1) % dialogs.length;
            bubble.innerText = dialogs[idx];
        });

        function handleSend() {
            const val = userInput.value.trim();
            if (val !== "") {
                bubble.innerText = `"${val}" Processing... ⚡`;
                userInput.value = "";
            }
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });
    </script>
</body>
</html>
