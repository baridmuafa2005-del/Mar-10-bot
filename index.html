<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Custom Music Rhythm Tiles - By Mario</title>
    <!-- Import Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            background: #09090b;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #setup-screen {
            text-align: center;
            background: rgba(30, 41, 59, 0.95);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            max-width: 400px;
            width: 90%;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
        }

        input[type="file"] { display: none; }
        
        .btn {
            background: #3b82f6;
            color: white;
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            display: inline-block;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            transition: all 0.2s ease;
        }
        .btn:active { transform: scale(0.95); }

        /* Selector Difficulty */
        .diff-container {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .diff-btn {
            background: #334155;
            color: #94a3b8;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .diff-btn.active {
            background: #38bdf8;
            color: #0f172a;
            box-shadow: 0 0 10px #38bdf8;
        }

        /* Container Game & Shake */
        #game-container {
            display: none;
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 400px;
            max-height: 680px;
            background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)), url('bg.jpg');
            background-size: cover;
            background-position: center;
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            transition: transform 0.05s ease;
        }

        #game-container.shake {
            animation: hitShake 0.08s ease-in-out;
        }

        @keyframes hitShake {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-3px, 2px); }
            50% { transform: translate(3px, -2px); }
            75% { transform: translate(-2px, -1px); }
            100% { transform: translate(0, 0); }
        }

        canvas { display: block; width: 100%; height: 100%; }

        .signature {
            position: absolute;
            top: 12px;
            right: 16px;
            font-family: 'Great Vibes', cursive;
            font-size: 26px;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8), 0 0 15px rgba(56, 189, 248, 0.6);
            z-index: 10;
            pointer-events: none;
        }

        #score-board {
            position: absolute;
            top: 14px;
            left: 16px;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 2px 4px #000;
            z-index: 10;
        }

        /* HUD Combo Center */
        #combo-hud {
            position: absolute;
            top: 18%;
            width: 100%;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            pointer-events: none;
            z-index: 10;
        }

        #hit-text {
            font-size: 24px;
            font-weight: 900;
            color: #38bdf8;
            text-shadow: 0 0 12px #38bdf8;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        #combo-count {
            font-size: 18px;
            color: #fbbf24;
            text-shadow: 0 0 10px #fbbf24;
            margin-top: 4px;
            opacity: 0;
        }

        .key-hints {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 85px;
            display: flex;
            background: rgba(0, 0, 0, 0.65);
            border-top: 2px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            z-index: 10;
        }

        .key-box {
            flex: 1;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #e2e8f0;
            touch-action: manipulation;
            transition: background 0.05s ease, box-shadow 0.05s ease, transform 0.05s ease;
        }
        .key-box:last-child { border-right: none; }

        .key-box.active {
            background: rgba(56, 189, 248, 0.45);
            box-shadow: 0 0 25px #38bdf8, inset 0 0 15px #ffffff;
            color: #ffffff;
            text-shadow: 0 0 10px #ffffff, 0 0 20px #38bdf8;
            transform: translateY(2px);
        }
    </style>
</head>
<body>

<div id="setup-screen">
    <h2>🎵 Custom Music Tiles</h2>
    <p style="margin-top:10px; font-size:14px; color:#94a3b8;">Import lagu MP3/WAV dari perangkat kamu!</p>
    
    <label class="btn" style="margin-top:20px;">
        Pilih Lagu
        <input type="file" id="audio-input" accept="audio/*">
    </label>
    <div id="file-name" style="margin-top:10px; font-size:12px; color:#38bdf8;"></div>

    <p style="margin-top:15px; font-size:12px; color:#64748b;">Kecepatan Tile:</p>
    <div class="diff-container">
        <button class="diff-btn active" data-speed="350">Pelan</button>
        <button class="diff-btn" data-speed="480">Sedang</button>
        <button class="diff-btn" data-speed="620">Cepat</button>
    </div>
    
    <button class="btn" id="start-btn" style="display:none; background:#22c55e;">Mulai Game</button>
</div>

<div id="game-container">
    <div id="score-board">Score: <span id="score">0</span></div>
    <div class="signature">By Mario</div>
    
    <div id="combo-hud">
        <div id="hit-text">PERFECT</div>
        <div id="combo-count">0x COMBO</div>
    </div>

    <canvas id="gameCanvas" width="360" height="600"></canvas>
    
    <div class="key-hints">
        <div class="key-box" id="k-Left" data-lane="0">←</div>
        <div class="key-box" id="k-Up" data-lane="1">↑</div>
        <div class="key-box" id="k-Down" data-lane="2">↓</div>
        <div class="key-box" id="k-Right" data-lane="3">→</div>
    </div>
</div>

<script>
    const audioInput = document.getElementById('audio-input');
    const startBtn = document.getElementById('start-btn');
    const fileNameDiv = document.getElementById('file-name');
    const setupScreen = document.getElementById('setup-screen');
    const gameContainer = document.getElementById('game-container');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hitText = document.getElementById('hit-text');
    const comboCount = document.getElementById('combo-count');

    let audioCtx, audioBuffer, audioSource;
    let tiles = [];
    let score = 0;
    let combo = 0;
    let isPlaying = false;
    let startTime = 0;
    let gameSpeed = 350;

    let activeLanes = [false, false, false, false];

    // System Partikel Ambient Background
    let bgParticles = [];
    for (let i = 0; i < 20; i++) {
        bgParticles.push({
            x: Math.random() * 360,
            y: Math.random() * 600,
            radius: Math.random() * 2 + 0.8,
            alpha: Math.random() * 0.7 + 0.3,
            speedY: Math.random() * 0.4 + 0.1,
            pulse: Math.random() * 0.02 + 0.005
        });
    }

    // System Partikel Ledakan Hit (Burst)
    let hitParticles = [];

    const keyMap = {
        'ArrowLeft': 0, 'ArrowUp': 1, 'ArrowDown': 2, 'ArrowRight': 3
    };

    const keyBoxes = [
        document.getElementById('k-Left'),
        document.getElementById('k-Up'),
        document.getElementById('k-Down'),
        document.getElementById('k-Right')
    ];

    // Opsi Difficulty Speed
    document.querySelectorAll('.diff-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            gameSpeed = parseInt(btn.getAttribute('data-speed'));
        });
    });

    audioInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            fileNameDiv.innerText = file.name;
            startBtn.style.display = 'inline-block';
            
            const reader = new FileReader();
            reader.onload = function(evt) {
                const arrayBuffer = evt.target.result;
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                audioCtx.decodeAudioData(arrayBuffer, (buffer) => {
                    audioBuffer = buffer;
                });
            };
            reader.readAsArrayBuffer(file);
        }
    });

    // SFX Synthesizer Suara Hit
    function playHitSFX(isPerfect) {
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(isPerfect ? 587.33 : 440, audioCtx.currentTime); // D5 or A4
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
    }

    function generateTilesFromAudio(buffer) {
        const data = buffer.getChannelData(0);
        const sampleRate = buffer.sampleRate;
        const step = Math.floor(sampleRate / 10);
        let generatedTiles = [];

        for (let i = 0; i < data.length; i += step) {
            let sum = 0;
            for (let j = 0; j < step && (i + j) < data.length; j++) {
                sum += Math.abs(data[i + j]);
            }
            let average = sum / step;

            if (average > 0.18) { 
                let lane = Math.floor(Math.random() * 4);
                let time = i / sampleRate; 
                let length = Math.min(Math.max(average * 400, 80), 220); 

                let lastTile = generatedTiles[generatedTiles.length - 1];
                if (!lastTile || (time - lastTile.time > 0.28)) {
                    generatedTiles.push({
                        lane: lane,
                        time: time,
                        length: length,
                        y: -length,
                        hit: false,
                        missed: false
                    });
                }
            }
        }
        return generatedTiles;
    }

    startBtn.addEventListener('click', () => {
        if (!audioBuffer) return;
        setupScreen.style.display = 'none';
        gameContainer.style.display = 'block';

        tiles = generateTilesFromAudio(audioBuffer);
        
        audioSource = audioCtx.createBufferSource();
        audioSource.buffer = audioBuffer;
        audioSource.connect(audioCtx.destination);
        
        startTime = audioCtx.currentTime;
        audioSource.start(0);
        isPlaying = true;

        requestAnimationFrame(gameLoop);
    });

    // Controls Keyboard & Touch
    window.addEventListener('keydown', (e) => {
        if (keyMap.hasOwnProperty(e.key)) triggerHit(keyMap[e.key]);
    });

    window.addEventListener('keyup', (e) => {
        if (keyMap.hasOwnProperty(e.key)) {
            let lane = keyMap[e.key];
            keyBoxes[lane].classList.remove('active');
            activeLanes[lane] = false;
        }
    });

    keyBoxes.forEach((box) => {
        const lane = parseInt(box.getAttribute('data-lane'));
        box.addEventListener('touchstart', (e) => {
            e.preventDefault();
            triggerHit(lane);
        }, { passive: false });

        box.addEventListener('touchend', (e) => {
            e.preventDefault();
            keyBoxes[lane].classList.remove('active');
            activeLanes[lane] = false;
        }, { passive: false });
    });

    function spawnHitBurst(x, y) {
        for (let i = 0; i < 12; i++) {
            hitParticles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 8,
                vy: (Math.random() - 0.5) * 8,
                radius: Math.random() * 3 + 2,
                alpha: 1,
                color: i % 2 === 0 ? '#38bdf8' : '#ffffff'
            });
        }
    }

    function triggerHit(lane) {
        keyBoxes[lane].classList.add('active');
        activeLanes[lane] = true;
        const hitZoneY = 520;
        let hasHit = false;

        // Shake
        gameContainer.classList.remove('shake');
        void gameContainer.offsetWidth;
        gameContainer.classList.add('shake');

        tiles.forEach(tile => {
            if (tile.lane === lane && !tile.hit && !tile.missed) {
                let hitOffset = Math.abs((tile.y + tile.length) - hitZoneY);
                
                if (hitOffset <= 70) {
                    tile.hit = true;
                    hasHit = true;
                    combo++;
                    
                    let isPerfect = hitOffset <= 30;
                    let points = isPerfect ? 150 : 80;
                    score += points + (combo * 5);
                    
                    document.getElementById('score').innerText = score;
                    showFeedback(isPerfect ? 'PERFECT!' : 'GREAT!', isPerfect ? '#38bdf8' : '#34d399');
                    playHitSFX(isPerfect);
                    spawnHitBurst(lane * 90 + 45, hitZoneY);
                }
            }
        });

        if (!hasHit) {
            // Mis-click kosong
        }
    }

    function showFeedback(text, color) {
        hitText.innerText = text;
        hitText.style.color = color;
        hitText.style.textShadow = `0 0 12px ${color}`;
        hitText.style.opacity = '1';
        hitText.style.transform = 'scale(1.1)';

        if (combo > 1) {
            comboCount.innerText = `${combo}x COMBO`;
            comboCount.style.opacity = '1';
        }

        setTimeout(() => {
            hitText.style.opacity = '0';
            hitText.style.transform = 'scale(1.0)';
        }, 300);
    }

    function gameLoop() {
        if (!isPlaying) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Ambient Particles
        bgParticles.forEach(p => {
            p.y -= p.speedY;
            p.alpha += p.pulse;
            if (p.alpha > 0.8 || p.alpha < 0.2) p.pulse = -p.pulse;
            if (p.y < 0) p.y = canvas.height;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(186, 230, 253, ${p.alpha})`;
            ctx.fill();
        });

        // Lane Beam
        for (let i = 0; i < 4; i++) {
            if (activeLanes[i]) {
                let gradBeam = ctx.createLinearGradient(0, 0, 0, canvas.height);
                gradBeam.addColorStop(0, 'rgba(56, 189, 248, 0)');
                gradBeam.addColorStop(1, 'rgba(56, 189, 248, 0.35)');
                ctx.fillStyle = gradBeam;
                ctx.fillRect(i * 90, 0, 90, canvas.height);
            }
        }

        // Grid Lines
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        for (let i = 1; i < 4; i++) {
            ctx.beginPath();
            ctx.moveTo(i * 90, 0);
            ctx.lineTo(i * 90, canvas.height);
            ctx.stroke();
        }

        let elapsedTime = audioCtx.currentTime - startTime;

        // Render & Update Tiles
        tiles.forEach(tile => {
            tile.y = (elapsedTime - tile.time) * gameSpeed;

            // Cek Miss (Ubin kelewatan)
            if (!tile.hit && !tile.missed && tile.y > 580) {
                tile.missed = true;
                combo = 0;
                comboCount.style.opacity = '0';
                showFeedback('MISS', '#ef4444');
            }

            if (!tile.hit && !tile.missed) {
                let grad = ctx.createLinearGradient(0, tile.y, 0, tile.y + tile.length);
                grad.addColorStop(0, '#38bdf8');
                grad.addColorStop(1, '#818cf8');

                ctx.fillStyle = grad;
                ctx.fillRect(tile.lane * 90 + 5, tile.y, 80, tile.length);

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1;
                ctx.strokeRect(tile.lane * 90 + 5, tile.y, 80, tile.length);
            }
        });

        // Render Burst Particles
        hitParticles.forEach((p, index) => {
            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= 0.04;

            if (p.alpha <= 0) {
                hitParticles.splice(index, 1);
            } else {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        });

        requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
