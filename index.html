<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAR-10 Multi-Robot Lab</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Roboto, sans-serif; }

        body { 
            background: #040108; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            position: relative;
        }

        /* EFEK GRID & SCANLINE DILUAR KOTAK (BIAR RAME) */
        .bg-grid {
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(rgba(186, 104, 200, 0.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(186, 104, 200, 0.07) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(500px) rotateX(60deg);
            bottom: -50%;
            z-index: 0;
            pointer-events: none;
        }

        .scanline {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent 50%, rgba(0, 240, 255, 0.03) 51%);
            background-size: 100% 4px;
            z-index: 1;
            pointer-events: none;
        }

        .credit {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #e1bee7;
            font-size: 13px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(186, 104, 200, 0.3);
            z-index: 10;
        }

        /* CONTAINER UTAMA MENAMPUNG 3 ROBOT */
        .lab-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            z-index: 2;
            width: 100%;
            max-width: 950px;
            padding: 20px;
        }

        /* CARD ROBOT PENDAMPING (KIRI & KANAN) */
        .side-robot-card {
            background: rgba(18, 10, 28, 0.7);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 20px;
            padding: 16px;
            width: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.15);
            backdrop-filter: blur(12px);
            position: relative;
        }

        .side-title {
            color: #00f0ff;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        /* DESAIN ROBOT KIRI: SCANNER ROBOT */
        .scanner-bot {
            width: 80px;
            height: 95px;
            background: #140824;
            border: 2px solid #00f0ff;
            border-radius: 16px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            animation: floatSide 4s infinite ease-in-out;
        }

        .scanner-visor {
            width: 60px;
            height: 25px;
            background: #080210;
            border-radius: 8px;
            border: 1px solid #00f0ff;
            position: relative;
            overflow: hidden;
        }

        .laser-beam {
            width: 100%;
            height: 3px;
            background: #00f0ff;
            box-shadow: 0 0 8px #00f0ff;
            position: absolute;
            animation: scanBeam 1.5s infinite alternate ease-in-out;
        }

        @keyframes scanBeam {
            0% { top: 0%; }
            100% { top: 85%; }
        }

        /* DESAIN ROBOT KANAN: RADAR/SECURITY ROBOT */
        .radar-bot {
            width: 80px;
            height: 95px;
            background: #140824;
            border: 2px solid #ab47bc;
            border-radius: 16px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(171, 71, 188, 0.3);
            animation: floatSide 3.5s infinite ease-in-out reverse;
        }

        .radar-antenna {
            width: 3px;
            height: 16px;
            background: #ab47bc;
            position: absolute;
            top: -16px;
        }

        .radar-dish {
            width: 14px;
            height: 14px;
            border: 2px solid #ab47bc;
            border-radius: 50%;
            position: absolute;
            top: -24px;
            animation: rotateRadar 2s infinite linear;
        }

        @keyframes rotateRadar {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes floatSide {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .status-badge {
            margin-top: 12px;
            font-size: 10px;
            color: #a7ffeb;
            background: rgba(0, 240, 255, 0.1);
            padding: 4px 8px;
            border-radius: 8px;
            border: 1px solid rgba(0, 240, 255, 0.2);
        }

        /* CARD ROBOT UTAMA (MAR-10) */
        .main-card {
            background: rgba(18, 10, 28, 0.92);
            border: 1.5px solid rgba(186, 104, 200, 0.5);
            border-radius: 28px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 45px rgba(123, 31, 162, 0.45);
            backdrop-filter: blur(16px);
            width: 350px;
            position: relative;
        }

        .brand {
            color: #fff;
            font-weight: 800;
            letter-spacing: 4px;
            margin-bottom: 12px;
            text-shadow: 0 0 12px #ab47bc;
        }

        .chat-bubble {
            background: rgba(186, 104, 200, 0.15);
            border: 1px solid rgba(186, 104, 200, 0.4);
            color: #f3e5f5;
            padding: 10px 18px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 0 10px rgba(186, 104, 200, 0.2);
            transition: all 0.2s ease;
            width: 100%;
        }

        .robot-stage {
            width: 100%;
            height: 190px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        /* TEKS HELLO KANAN (PERTAMA MASUK WEB) */
        .hello-side-text {
            position: absolute;
            right: -12px;
            top: 25%;
            font-size: 36px;
            font-weight: 900;
            color: #00f0ff;
            text-shadow: 0 0 15px #00f0ff, 0 0 30px #ab47bc;
            letter-spacing: 2px;
            z-index: 5;
            animation: pulseHello 1.5s infinite alternate ease-in-out;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        @keyframes pulseHello {
            0% { transform: scale(1) translateY(0); opacity: 0.85; }
            100% { transform: scale(1.08) translateY(-4px); opacity: 1; }
        }

        .hello-side-text.hidden {
            opacity: 0;
            transform: scale(0.6) translateX(20px);
            pointer-events: none;
        }

        /* ROBOT UTAMA */
        .robot-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            animation: floatRobot 3s infinite ease-in-out;
            z-index: 2;
        }

        @keyframes floatRobot {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-7px); }
        }

        .robot-head {
            width: 150px;
            height: 115px;
            background: linear-gradient(145deg, #2b1842, #140924);
            border: 3px solid #ba68c8;
            border-radius: 30px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(186, 104, 200, 0.3);
        }

        .ear {
            width: 13px;
            height: 24px;
            background: #ba68c8;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            border-radius: 5px;
        }
        .ear.left { left: -11px; }
        .ear.right { right: -11px; }

        .robot-screen {
            width: 115px;
            height: 75px;
            background: #090312;
            border-radius: 18px;
            border: 2px solid rgba(186, 104, 200, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .face-features {
            display: flex;
            gap: 20px;
            align-items: center;
            transition: transform 0.08s ease-out;
            will-change: transform;
        }

        .eye {
            width: 15px;
            height: 22px;
            background: #00f0ff;
            border-radius: 10px;
            box-shadow: 0 0 12px #00f0ff;
            transition: all 0.2s ease;
        }

        .eye.happy { height: 8px; border-radius: 10px 10px 0 0; background: #00f0ff; box-shadow: 0 0 12px #00f0ff; }
        .eye.focus { height: 5px; width: 18px; background: #ffaa00; box-shadow: 0 0 12px #ffaa00; }
        .eye.ouch { transform: rotate(25deg); background: #ff0055; box-shadow: 0 0 12px #ff0055; height: 15px; }
        .eye.angry { transform: rotate(-25deg); background: #ff0055; box-shadow: 0 0 12px #ff0055; height: 15px; }

        .robot-body {
            width: 95px;
            height: 42px;
            background: linear-gradient(145deg, #1d0f30, #10061c);
            border: 3px solid #ba68c8;
            border-top: none;
            border-radius: 0 0 20px 20px;
            margin-top: -4px;
            position: relative;
        }

        .arm {
            width: 15px;
            height: 38px;
            background: #ba68c8;
            position: absolute;
            top: 20%;
            border-radius: 8px;
            box-shadow: 0 0 8px rgba(186, 104, 200, 0.4);
            transition: transform 0.2s ease;
        }

        .arm.left { left: -16px; transform-origin: top right; transform: rotate(20deg); }
        .arm.right { right: -16px; transform-origin: top left; transform: rotate(-20deg); }

        .robot-container.active .arm.left { transform: rotate(50deg); }
        .robot-container.active .arm.right { transform: rotate(-50deg); }

        /* VISUALISASI AUDIO WAVEFORM DI ATAS INPUT INPUT */
        .audio-wave {
            display: flex;
            gap: 4px;
            align-items: flex-end;
            height: 14px;
            margin-bottom: 8px;
        }

        .wave-bar {
            width: 3px;
            height: 100%;
            background: #ba68c8;
            border-radius: 2px;
            animation: waveAnim 1s infinite ease-in-out alternate;
        }

        .wave-bar:nth-child(1) { animation-delay: 0.1s; }
        .wave-bar:nth-child(2) { animation-delay: 0.3s; }
        .wave-bar:nth-child(3) { animation-delay: 0.5s; }
        .wave-bar:nth-child(4) { animation-delay: 0.2s; }
        .wave-bar:nth-child(5) { animation-delay: 0.4s; }

        @keyframes waveAnim {
            0% { height: 20%; }
            100% { height: 100%; }
        }

        .input-group { display: flex; width: 100%; gap: 8px; }
        input {
            flex: 1; background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(186, 104, 200, 0.3);
            border-radius: 12px; padding: 10px 14px; color: #fff; outline: none; font-size: 13px;
        }
        input:focus { border-color: #ba68c8; box-shadow: 0 0 8px rgba(186, 104, 200, 0.3); }
        button {
            background: linear-gradient(135deg, #ab47bc, #7b1fa2);
            border: none; color: #fff; font-weight: bold; padding: 10px 16px; border-radius: 12px; cursor: pointer;
            box-shadow: 0 4px 12px rgba(123, 31, 162, 0.4);
        }

        @media (max-width: 768px) {
            .side-robot-card { display: none; }
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <div class="scanline"></div>

    <div class="credit">By Mario</div>

    <div class="lab-container">
        <!-- ROBOT KIRI: SCANNER BOT -->
        <div class="side-robot-card">
            <div class="side-title">UNIT-01 // SCAN</div>
            <div class="scanner-bot">
                <div class="scanner-visor">
                    <div class="laser-beam"></div>
                </div>
            </div>
            <div class="status-badge">SCANNING...</div>
        </div>

        <!-- ROBOT UTAMA: MAR-10 -->
        <div class="main-card">
            <div class="brand">MAR-10</div>
            
            <div class="chat-bubble" id="bubble">System Online</div>

            <div class="robot-stage">
                <div class="robot-container" id="robot">
                    <div class="robot-head">
                        <div class="ear left"></div>
                        <div class="robot-screen">
                            <div class="face-features" id="face">
                                <div class="eye" id="leftEye"></div>
                                <div class="eye" id="rightEye"></div>
                            </div>
                        </div>
                        <div class="ear right"></div>
                    </div>
                    <div class="robot-body">
                        <div class="arm left"></div>
                        <div class="arm right"></div>
                    </div>
                </div>

                <!-- TEKS HELLO KANAN -->
                <div class="hello-side-text" id="helloText">HELLO!</div>
            </div>

            <!-- VISUALISASI WAVEFORM SENSOR -->
            <div class="audio-wave">
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
            </div>

            <div class="input-group">
                <input type="text" id="userInput" placeholder="Say something..." autocomplete="off">
                <button id="sendBtn">Send</button>
            </div>
        </div>

        <!-- ROBOT KANAN: RADAR BOT -->
        <div class="side-robot-card">
            <div class="side-title">UNIT-02 // RADAR</div>
            <div class="radar-bot">
                <div class="radar-dish"></div>
                <div class="radar-antenna"></div>
                <div class="scanner-visor" style="width: 40px; height: 12px; margin-top: 10px;">
                    <div style="width: 8px; height: 8px; background: #ab47bc; border-radius: 50%; margin: 1px auto;"></div>
                </div>
            </div>
            <div class="status-badge" style="color: #e1bee7; background: rgba(171, 71, 188, 0.1); border-color: rgba(171, 71, 188, 0.3);">ACTIVE</div>
        </div>
    </div>

    <script>
        const face = document.getElementById('face');
        const leftEye = document.getElementById('leftEye');
        const rightEye = document.getElementById('rightEye');
        const bubble = document.getElementById('bubble');
        const robot = document.getElementById('robot');
        const helloText = document.getElementById('helloText');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        function trackMouse(x, y) {
            const rect = robot.getBoundingClientRect();
            const robotX = rect.left + rect.width / 2;
            const robotY = rect.top + rect.height / 2;

            const moveX = Math.max(-16, Math.min(16, (x - robotX) / 10));
            const moveY = Math.max(-10, Math.min(10, (y - robotY) / 10));

            face.style.transform = `translate(${moveX}px, ${moveY}px)`;
        }

        window.addEventListener('mousemove', (e) => trackMouse(e.clientX, e.clientY));
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) trackMouse(e.touches[0].clientX, e.touches[0].clientY);
        });

        // HILANGKAN TEKS HELLO SETIAP KALI DISENTUH/DIKLIK
        function dismissHello() {
            if (!helloText.classList.contains('hidden')) {
                helloText.classList.add('hidden');
            }
        }

        window.addEventListener('click', dismissHello);
        window.addEventListener('touchstart', dismissHello);

        const reactions = [
            { text: "Hello Mario", class: "happy" },
            { text: "Focusing on task", class: "focus" },
            { text: "Ouch stop it", class: "ouch" },
            { text: "System ready", class: "" },
            { text: "Don't touch my face", class: "angry" }
        ];
        let stateIndex = 0;

        robot.addEventListener('click', (e) => {
            e.stopPropagation();
            dismissHello();

            const state = reactions[stateIndex];
            bubble.innerText = state.text;

            leftEye.className = "eye " + state.class;
            rightEye.className = "eye " + state.class;

            robot.classList.add('active');
            setTimeout(() => robot.classList.remove('active'), 300);

            stateIndex = (stateIndex + 1) % reactions.length;
        });

        function handleSend() {
            const val = userInput.value.trim();
            if (val !== "") {
                dismissHello();
                bubble.innerText = `Processing: ${val}`;
                userInput.value = "";
                leftEye.className = "eye focus";
                rightEye.className = "eye focus";
            }
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSend(); });
    </script>
</body>
</html>
