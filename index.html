<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Custom Music Rhythm Tiles</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #setup-screen, #result-screen {
            text-align: center;
            background: rgba(10, 15, 30, 0.9);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(0,191,255,0.3);
            max-width: 360px;
            width: 90%;
            border: 1px solid #38bdf8;
            z-index: 30;
        }

        #result-screen { display: none; }
        input[type="file"] { display: none; }
        
        .btn-select-song {
            background: #0284c7;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            margin-top: 15px;
            display: inline-block;
            box-shadow: 0 0 10px rgba(2, 132, 199, 0.5);
        }

        .option-group { margin-top: 15px; }
        .option-label { font-size: 12px; color: #cbd5e1; margin-bottom: 8px; font-weight: bold; }

        .diff-container { display: flex; justify-content: center; gap: 8px; }

        .opt-btn {
            background: #1e293b;
            color: #fff;
            border: 1px solid #334155;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            flex: 1;
        }
        .opt-btn.active {
            background: #38bdf8;
            color: #000;
            border-color: #38bdf8;
            box-shadow: 0 0 10px #38bdf8;
        }

        #start-btn {
            background: #10b981;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            width: 100%;
            margin-top: 20px;
            cursor: pointer;
            display: none;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
        }

        #game-container {
            display: none;
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 380px;
            max-height: 640px;
            background: url('bg.jpg') center/cover no-repeat #000;
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            transition: transform 0.05s ease;
        }

        .shake {
            animation: shakeAnim 0.15s ease;
        }
        @keyframes shakeAnim {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-3px, 3px); }
            40% { transform: translate(3px, -2px); }
            60% { transform: translate(-2px, -3px); }
            80% { transform: translate(2px, 2px); }
            100% { transform: translate(0, 0); }
        }

        #game-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.45);
            pointer-events: none;
            z-index: 1;
        }

        canvas { display: block; width: 100%; height: 100%; position: relative; z-index: 2; }

        .signature {
            position: absolute;
            top: 12px;
            right: 20px;
            font-family: 'Great Vibes', cursive;
            font-size: 32px;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(0,0,0,0.9), 0 0 15px #38bdf8;
            z-index: 10;
            pointer-events: none;
        }

        #score-board {
            position: absolute;
            top: 16px;
            left: 20px;
            font-size: 16px;
            font-weight: bold;
            font-family: Arial, sans-serif;
            color: #ffffff;
            text-shadow: 0 0 8px #000, 0 0 12px #38bdf8;
            z-index: 10;
        }

        #combo-hud {
            position: absolute;
            top: 42%;
            width: 100%;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            pointer-events: none;
            z-index: 10;
        }

        #hit-text {
            font-size: 26px;
            font-weight: 900;
            color: #38bdf8;
            text-shadow: 0 0 10px #000, 0 0 15px #38bdf8;
            opacity: 0;
            transition: opacity 0.15s ease, transform 0.1s ease;
        }

        #combo-count {
            font-size: 16px;
            color: #fbbf24;
            text-shadow: 0 0 8px #000;
            margin-top: 4px;
            opacity: 0;
        }

        .key-hints {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 75px;
            display: flex;
            background: rgba(0, 0, 0, 0.7);
            border-top: 1.5px solid rgba(255, 255, 255, 0.25);
            z-index: 10;
        }

        .key-box {
            flex: 1;
            border-right: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            color: #fff;
            touch-action: manipulation;
        }
        .key-box:last-child { border-right: none; }
        .key-box.active {
            background: rgba(56, 189, 248, 0.5);
            box-shadow: inset 0 0 15px #38bdf8;
        }

        .stat-list {
            text-align: left;
            margin: 15px 0;
            font-size: 14px;
            line-height: 1.8;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

<div id="setup-screen">
    <h2>🎵 Custom Music Rhythm Tiles</h2>
    <p style="margin-top:6px; font-size:12px; color:#aaa;">Pilih lagu favoritmu!</p>
    
    <label class="btn-select-song">
        📁 Pilih File Audio
        <input type="file" id="audio-input" accept="audio/*">
    </label>
    <div id="file-name" style="margin-top:8px; font-size:12px; color:#38bdf8; font-weight:bold;"></div>

    <div class="option-group">
        <div class="option-label">Kecepatan Tile:</div>
        <div class="diff-container">
            <button class="opt-btn diff-btn active" data-speed="4">Pelan</button>
            <button class="opt-btn diff-btn" data-speed="6">Sedang</button>
            <button class="opt-btn diff-btn" data-speed="8">Cepat</button>
        </div>
    </div>
    
    <button id="start-btn">MULAI GAME 🚀</button>
</div>

<div id="result-screen">
    <h2>🎉 RESULT</h2>
    <div class="stat-list">
        <div>Score: <b id="res-score" style="color:#fff;">0</b></div>
        <div>Perfect: <b id="res-perfect" style="color:#34d399;">0</b></div>
        <div>Great: <b id="res-great" style="color:#38bdf8;">0</b></div>
        <div>Good: <b id="res-good" style="color:#fbbf24;">0</b></div>
        <div>Miss: <b id="res-miss" style="color:#ef4444;">0</b></div>
        <div>Max Combo: <b id="res-combo" style="color:#a855f7;">0x</b></div>
    </div>
    <button class="opt-btn active" onclick="location.reload()" style="width:100%; padding:12px; font-size:14px;">Main Lagi 🔄</button>
</div>

<div id="game-container">
    <div id="game-overlay"></div>
    <div id="score-board">Score: <span id="score">0</span></div>
    
    <div class="signature">By Mario</div>
    
    <div id="combo-hud">
        <div id="hit-text">PERFECT</div>
        <div id="combo-count">0x COMBO</div>
    </div>

    <canvas id="gameCanvas" width="360" height="600"></canvas>
    
    <div class="key-hints">
        <div class="key-box" id="k-Left" data-lane="0">←</div>
        <div class="key-box" id="k-Up" data-lane="1">↑</div>
        <div class="key-box" id="k-Down" data-lane="2">↓</div>
        <div class="key-box" id="k-Right" data-lane="3">→</div>
    </div>
</div>

<audio id="bg-audio"></audio>

<script>
    const audioInput = document.getElementById('audio-input');
    const startBtn = document.getElementById('start-btn');
    const fileNameDiv = document.getElementById('file-name');
    const setupScreen = document.getElementById('setup-screen');
    const resultScreen = document.getElementById('result-screen');
    const gameContainer = document.getElementById('game-container');
    const bgAudio = document.getElementById('bg-audio');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hitText = document.getElementById('hit-text');
    const comboCount = document.getElementById('combo-count');

    let tiles = [];
    let particles = [];
    let bgParticles = []; // Partikel cahaya background
    let score = 0, combo = 0, maxCombo = 0;
    let countPerfect = 0, countGreat = 0, countGood = 0, countMiss = 0;
    let isPlaying = false;
    let tileSpeed = 4;
    let spawnInterval = null;

    const keyMap = { 'ArrowLeft': 0, 'ArrowUp': 1, 'ArrowDown': 2, 'ArrowRight': 3 };
    const keyBoxes = [
        document.getElementById('k-Left'), document.getElementById('k-Up'),
        document.getElementById('k-Down'), document.getElementById('k-Right')
    ];

    document.querySelectorAll('.diff-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            tileSpeed = parseInt(btn.getAttribute('data-speed'));
        });
    });

    audioInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            bgAudio.src = URL.createObjectURL(file);
            fileNameDiv.innerText = "🎵 " + file.name;
            startBtn.style.display = 'block';
        }
    });

    // Inisialisasi partikel cahaya background yang melayang
    function initBgParticles() {
        bgParticles = [];
        for (let i = 0; i < 25; i++) {
            bgParticles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 3 + 1,
                speedY: Math.random() * 0.8 + 0.2,
                alpha: Math.random() * 0.7 + 0.3
            });
        }
    }

    function startGame() {
        if (!bgAudio.src) return;

        setupScreen.style.display = 'none';
        gameContainer.style.display = 'block';

        initBgParticles();
        bgAudio.play();
        isPlaying = true;

        let spawnRate = tileSpeed === 4 ? 600 : (tileSpeed === 6 ? 450 : 320);
        spawnInterval = setInterval(() => {
            if(isPlaying) {
                let isLong = Math.random() < 0.25; 
                let tHeight = isLong ? 140 : 75;

                tiles.push({
                    lane: Math.floor(Math.random() * 4),
                    y: -tHeight,
                    height: tHeight,
                    hit: false,
                    missed: false
                });
            }
        }, spawnRate);

        bgAudio.onended = showResult;
        requestAnimationFrame(gameLoop);
    }

    startBtn.addEventListener('click', startGame);

    function triggerShake() {
        gameContainer.classList.remove('shake');
        void gameContainer.offsetWidth;
        gameContainer.classList.add('shake');
    }

    function createSparks(lane, color) {
        let sparkX = lane * 90 + 45;
        let sparkY = 520;
        for (let i = 0; i < 14; i++) {
            let angle = Math.random() * Math.PI - Math.PI / 2;
            let speed = Math.random() * 6 + 2;
            particles.push({
                x: sparkX,
                y: sparkY,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 2,
                alpha: 1,
                color: color,
                size: Math.random() * 4 + 2
            });
        }
    }

    function triggerHit(lane) {
        keyBoxes[lane].classList.add('active');
        const hitZoneY = 520;

        tiles.forEach(tile => {
            if (tile.lane === lane && !tile.hit && !tile.missed) {
                let hitOffset = Math.abs(tile.y + tile.height - hitZoneY);
                
                if (hitOffset <= 80) {
                    tile.hit = true;
                    combo++;
                    if (combo > maxCombo) maxCombo = combo;

                    if (hitOffset <= 25) {
                        countPerfect++;
                        showFeedback('PERFECT!', '#34d399');
                        score += 150 + (combo * 5);
                        createSparks(lane, '#34d399');
                        triggerShake();
                    } else if (hitOffset <= 50) {
                        countGreat++;
                        showFeedback('GREAT!', '#38bdf8');
                        score += 100 + (combo * 3);
                        createSparks(lane, '#38bdf8');
                    } else {
                        countGood++;
                        showFeedback('GOOD', '#fbbf24');
                        score += 50;
                        createSparks(lane, '#fbbf24');
                    }

                    document.getElementById('score').innerText = score;
                }
            }
        });
    }

    function releaseHit(lane) {
        keyBoxes[lane].classList.remove('active');
    }

    window.addEventListener('keydown', (e) => {
        if (keyMap.hasOwnProperty(e.key)) triggerHit(keyMap[e.key]);
    });

    window.addEventListener('keyup', (e) => {
        if (keyMap.hasOwnProperty(e.key)) releaseHit(keyMap[e.key]);
    });

    keyBoxes.forEach((box) => {
        const lane = parseInt(box.getAttribute('data-lane'));
        box.addEventListener('touchstart', (e) => {
            e.preventDefault();
            triggerHit(lane);
        });
        box.addEventListener('touchend', (e) => {
            e.preventDefault();
            releaseHit(lane);
        });
    });

    function resetCombo() {
        combo = 0;
        comboCount.style.opacity = '0';
    }

    function showFeedback(text, color) {
        hitText.innerText = text;
        hitText.style.color = color;
        hitText.style.textShadow = `0 0 10px #000, 0 0 15px ${color}`;
        hitText.style.opacity = '1';

        if (combo > 1) {
            comboCount.innerText = `${combo}x COMBO`;
            comboCount.style.opacity = '1';
        }

        setTimeout(() => { hitText.style.opacity = '0'; }, 300);
    }

    function showResult() {
        isPlaying = false;
        clearInterval(spawnInterval);
        gameContainer.style.display = 'none';
        resultScreen.style.display = 'block';

        document.getElementById('res-score').innerText = score;
        document.getElementById('res-perfect').innerText = countPerfect;
        document.getElementById('res-great').innerText = countGreat;
        document.getElementById('res-good').innerText = countGood;
        document.getElementById('res-miss').innerText = countMiss;
        document.getElementById('res-combo').innerText = `${maxCombo}x`;
    }

    function gameLoop() {
        if (!isPlaying) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Render Partikel Cahaya Background (Mengambang Pelan)
        bgParticles.forEach(p => {
            p.y -= p.speedY;
            if (p.y < 0) {
                p.y = canvas.height;
                p.x = Math.random() * canvas.width;
            }
            ctx.save();
            ctx.globalAlpha = p.alpha * 0.6;
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        });

        // 2. Garis Jalur Vertikal (Lanes)
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.lineWidth = 1;
        for (let i = 1; i < 4; i++) {
            ctx.beginPath();
            ctx.moveTo(i * 90, 0);
            ctx.lineTo(i * 90, canvas.height);
            ctx.stroke();
        }

        // Garis Target Hit Zone
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, 520);
        ctx.lineTo(360, 520);
        ctx.stroke();

        // 3. Render & Update Tiles (Variasi Panjang & Pendek)
        tiles.forEach(tile => {
            tile.y += tileSpeed;

            if (!tile.hit && !tile.missed && tile.y > 560) {
                tile.missed = true;
                countMiss++;
                resetCombo();
                showFeedback('MISS', '#ef4444');
            }

            if (!tile.hit && !tile.missed) {
                let grad = ctx.createLinearGradient(0, tile.y, 0, tile.y + tile.height);
                grad.addColorStop(0, '#38bdf8');
                grad.addColorStop(1, '#0284c7');

                ctx.fillStyle = grad;
                ctx.fillRect(tile.lane * 90 + 6, tile.y, 78, tile.height);

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(tile.lane * 90 + 6, tile.y, 78, tile.height);
            }
        });

        // 4. Render & Update Partikel Percikan Cahaya Saat Dipencet
        particles.forEach((p, index) => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.2; 
            p.alpha -= 0.03;

            if (p.alpha <= 0) {
                particles.splice(index, 1);
            } else {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        });

        requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
