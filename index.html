<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Custom Music Rhythm Tiles - By Mario</title>
    <!-- Import Font Signature (Great Vibes) dari Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            background: #09090b;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #setup-screen {
            text-align: center;
            background: rgba(30, 41, 59, 0.95);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            max-width: 400px;
            width: 90%;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
        }

        input[type="file"] { display: none; }
        
        .btn {
            background: #3b82f6;
            color: white;
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            display: inline-block;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            transition: all 0.2s ease;
        }
        .btn:active { transform: scale(0.95); }

        #game-container {
            display: none;
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 400px;
            max-height: 680px;
            /* Background Gambar */
            background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)), url('bg.jpg');
            background-size: cover;
            background-position: center;
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
        }

        canvas { display: block; width: 100%; height: 100%; }

        /* Signature "By Mario" */
        .signature {
            position: absolute;
            top: 12px;
            right: 16px;
            font-family: 'Great Vibes', cursive;
            font-size: 26px;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8), 0 0 15px rgba(56, 189, 248, 0.6);
            z-index: 10;
            pointer-events: none;
        }

        #score-board {
            position: absolute;
            top: 14px;
            left: 16px;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 2px 4px #000;
            z-index: 10;
        }

        /* Area Tombol Bawah */
        .key-hints {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 85px;
            display: flex;
            background: rgba(0, 0, 0, 0.65);
            border-top: 2px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            z-index: 10;
        }

        .key-box {
            flex: 1;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #e2e8f0;
            touch-action: manipulation;
            transition: background 0.05s ease, box-shadow 0.05s ease;
        }
        .key-box:last-child { border-right: none; }

        /* Efek Cahaya / Glow Saat Tombol Ditekan */
        .key-box.active {
            background: rgba(56, 189, 248, 0.45);
            box-shadow: 0 0 25px #38bdf8, inset 0 0 15px #ffffff;
            color: #ffffff;
            text-shadow: 0 0 10px #ffffff, 0 0 20px #38bdf8;
        }
    </style>
</head>
<body>

<div id="setup-screen">
    <h2>🎵 Custom Music Tiles</h2>
    <p style="margin-top:10px; font-size:14px; color:#94a3b8;">Import lagu MP3/WAV dari perangkat kamu!</p>
    
    <label class="btn" style="margin-top:20px;">
        Pilih Lagu
        <input type="file" id="audio-input" accept="audio/*">
    </label>
    <div id="file-name" style="margin-top:10px; font-size:12px; color:#38bdf8;"></div>
    
    <button class="btn" id="start-btn" style="display:none; background:#22c55e;">Mulai Game</button>
</div>

<div id="game-container">
    <div id="score-board">Score: <span id="score">0</span></div>
    <div class="signature">By Mario</div>
    
    <canvas id="gameCanvas" width="360" height="600"></canvas>
    
    <div class="key-hints">
        <div class="key-box" id="k-Left" data-lane="0">←</div>
        <div class="key-box" id="k-Up" data-lane="1">↑</div>
        <div class="key-box" id="k-Down" data-lane="2">↓</div>
        <div class="key-box" id="k-Right" data-lane="3">→</div>
    </div>
</div>

<script>
    const audioInput = document.getElementById('audio-input');
    const startBtn = document.getElementById('start-btn');
    const fileNameDiv = document.getElementById('file-name');
    const setupScreen = document.getElementById('setup-screen');
    const gameContainer = document.getElementById('game-container');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let audioCtx, audioBuffer, audioSource;
    let tiles = [];
    let score = 0;
    let isPlaying = false;
    let startTime = 0;

    // Status aktif tiap jalur untuk efek efek cahaya di canvas
    let activeLanes = [false, false, false, false];

    const keyMap = {
        'ArrowLeft': 0,
        'ArrowUp': 1,
        'ArrowDown': 2,
        'ArrowRight': 3
    };

    const keyBoxes = [
        document.getElementById('k-Left'),
        document.getElementById('k-Up'),
        document.getElementById('k-Down'),
        document.getElementById('k-Right')
    ];

    audioInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            fileNameDiv.innerText = file.name;
            startBtn.style.display = 'inline-block';
            
            const reader = new FileReader();
            reader.onload = function(evt) {
                const arrayBuffer = evt.target.result;
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                audioCtx.decodeAudioData(arrayBuffer, (buffer) => {
                    audioBuffer = buffer;
                });
            };
            reader.readAsArrayBuffer(file);
        }
    });

    function generateTilesFromAudio(buffer) {
        const data = buffer.getChannelData(0);
        const sampleRate = buffer.sampleRate;
        const step = Math.floor(sampleRate / 10);
        let generatedTiles = [];

        for (let i = 0; i < data.length; i += step) {
            let sum = 0;
            for (let j = 0; j < step && (i + j) < data.length; j++) {
                sum += Math.abs(data[i + j]);
            }
            let average = sum / step;

            if (average > 0.18) { 
                let lane = Math.floor(Math.random() * 4);
                let time = i / sampleRate; 
                let length = Math.min(Math.max(average * 400, 80), 220); 

                let lastTile = generatedTiles[generatedTiles.length - 1];
                if (!lastTile || (time - lastTile.time > 0.3)) {
                    generatedTiles.push({
                        lane: lane,
                        time: time,
                        length: length,
                        y: -length,
                        hit: false
                    });
                }
            }
        }
        return generatedTiles;
    }

    startBtn.addEventListener('click', () => {
        if (!audioBuffer) return;
        
        setupScreen.style.display = 'none';
        gameContainer.style.display = 'block';

        tiles = generateTilesFromAudio(audioBuffer);
        
        audioSource = audioCtx.createBufferSource();
        audioSource.buffer = audioBuffer;
        audioSource.connect(audioCtx.destination);
        
        startTime = audioCtx.currentTime;
        audioSource.start(0);
        isPlaying = true;

        requestAnimationFrame(gameLoop);
    });

    // --- KONTROL KEYBOARD ---
    window.addEventListener('keydown', (e) => {
        if (keyMap.hasOwnProperty(e.key)) {
            let lane = keyMap[e.key];
            triggerHit(lane);
        }
    });

    window.addEventListener('keyup', (e) => {
        if (keyMap.hasOwnProperty(e.key)) {
            let lane = keyMap[e.key];
            keyBoxes[lane].classList.remove('active');
            activeLanes[lane] = false;
        }
    });

    // --- KONTROL TOUCHSCREEN ---
    keyBoxes.forEach((box) => {
        const lane = parseInt(box.getAttribute('data-lane'));

        box.addEventListener('touchstart', (e) => {
            e.preventDefault();
            triggerHit(lane);
        }, { passive: false });

        box.addEventListener('touchend', (e) => {
            e.preventDefault();
            keyBoxes[lane].classList.remove('active');
            activeLanes[lane] = false;
        }, { passive: false });
    });

    function triggerHit(lane) {
        keyBoxes[lane].classList.add('active');
        activeLanes[lane] = true;
        const hitZoneY = 520;
        
        tiles.forEach(tile => {
            if (tile.lane === lane && !tile.hit) {
                if (tile.y + tile.length >= hitZoneY - 60 && tile.y <= hitZoneY + 60) {
                    tile.hit = true;
                    score += Math.floor(tile.length / 10);
                    document.getElementById('score').innerText = score;
                }
            }
        });
    }

    function gameLoop() {
        if (!isPlaying) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Efek Cahaya Sinar di Jalur Canvas Saat Ditekan
        for (let i = 0; i < 4; i++) {
            if (activeLanes[i]) {
                let gradBeam = ctx.createLinearGradient(0, 0, 0, canvas.height);
                gradBeam.addColorStop(0, 'rgba(56, 189, 248, 0)');
                gradBeam.addColorStop(1, 'rgba(56, 189, 248, 0.35)');
                ctx.fillStyle = gradBeam;
                ctx.fillRect(i * 90, 0, 90, canvas.height);
            }
        }

        // Garis Pembatas Jalur
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        for (let i = 1; i < 4; i++) {
            ctx.beginPath();
            ctx.moveTo(i * 90, 0);
            ctx.lineTo(i * 90, canvas.height);
            ctx.stroke();
        }

        let elapsedTime = audioCtx.currentTime - startTime;
        let speed = 400;

        // Render Tile
        tiles.forEach(tile => {
            tile.y = (elapsedTime - tile.time) * speed;

            if (!tile.hit) {
                let grad = ctx.createLinearGradient(0, tile.y, 0, tile.y + tile.length);
                grad.addColorStop(0, '#38bdf8');
                grad.addColorStop(1, '#818cf8');

                ctx.fillStyle = grad;
                ctx.fillRect(tile.lane * 90 + 5, tile.y, 80, tile.length);

                // Glow Border pada Tile
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1;
                ctx.strokeRect(tile.lane * 90 + 5, tile.y, 80, tile.length);
            }
        });

        requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
