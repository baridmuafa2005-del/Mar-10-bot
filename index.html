<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Music Rhythm Tiles</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f172a;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #setup-screen {
            text-align: center;
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
        }

        input[type="file"] { display: none; }
        
        .btn {
            background: #3b82f6;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            display: inline-block;
        }
        .btn:hover { background: #2563eb; }

        #game-container {
            display: none;
            position: relative;
            width: 360px;
            height: 600px;
            background: #1e1e2e;
            border: 4px solid #313244;
            border-radius: 8px;
            overflow: hidden;
        }

        canvas { display: block; width: 100%; height: 100%; }

        .key-hints {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60px;
            display: flex;
            background: rgba(0,0,0,0.4);
            border-top: 2px solid #89b4fa;
        }

        .key-box {
            flex: 1;
            border-right: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: #cdd6f4;
        }
        .key-box:last-child { border-right: none; }
        .key-box.active { background: rgba(137, 180, 250, 0.4); }

        #score-board {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
        }
    </style>
</head>
<body>

<div id="setup-screen">
    <h2>🎵 Custom Music Tiles</h2>
    <p style="margin-top:10px; font-size:14px; color:#94a3b8;">Import lagu MP3/WAV dari perangkat kamu buat dimainin!</p>
    
    <label class="btn" style="margin-top:20px;">
        Pilih Lagu
        <input type="file" id="audio-input" accept="audio/*">
    </label>
    <div id="file-name" style="margin-top:10px; font-size:12px; color:#38bdf8;"></div>
    
    <button class="btn" id="start-btn" style="display:none; background:#22c55e;">Mulai Game</button>
</div>

<div id="game-container">
    <div id="score-board">Score: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="360" height="600"></canvas>
    <div class="key-hints">
        <div class="key-box" id="k-Left">←</div>
        <div class="key-box" id="k-Up">↑</div>
        <div class="key-box" id="k-Down">↓</div>
        <div class="key-box" id="k-Right">→</div>
    </div>
</div>

<script>
    const audioInput = document.getElementById('audio-input');
    const startBtn = document.getElementById('start-btn');
    const fileNameDiv = document.getElementById('file-name');
    const setupScreen = document.getElementById('setup-screen');
    const gameContainer = document.getElementById('game-container');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let audioCtx, audioBuffer, audioSource;
    let tiles = [];
    let score = 0;
    let isPlaying = false;
    let startTime = 0;

    // Pemetaan Tombol Panah (Samping Ctrl)
    const keyMap = {
        'ArrowLeft': 0,  // Jalur 1
        'ArrowUp': 1,    // Jalur 2
        'ArrowDown': 2,  // Jalur 3
        'ArrowRight': 3  // Jalur 4
    };

    const keyElements = {
        'ArrowLeft': document.getElementById('k-Left'),
        'ArrowUp': document.getElementById('k-Up'),
        'ArrowDown': document.getElementById('k-Down'),
        'ArrowRight': document.getElementById('k-Right')
    };

    // 1. Handle Import File Audio
    audioInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            fileNameDiv.innerText = file.name;
            startBtn.style.display = 'inline-block';
            
            const reader = new FileReader();
            reader.onload = function(evt) {
                const arrayBuffer = evt.target.result;
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                audioCtx.decodeAudioData(arrayBuffer, (buffer) => {
                    audioBuffer = buffer;
                });
            };
            reader.readAsArrayBuffer(file);
        }
    });

    // 2. Generator Tiles Berdasarkan Analisis Beat Audio
    function generateTilesFromAudio(buffer) {
        const data = buffer.getChannelData(0);
        const sampleRate = buffer.sampleRate;
        const step = Math.floor(sampleRate / 10); // Cek tiap 0.1 detik
        let generatedTiles = [];

        for (let i = 0; i < data.length; i += step) {
            let sum = 0;
            for (let j = 0; j < step && (i + j) < data.length; j++) {
                sum += Math.abs(data[i + j]);
            }
            let average = sum / step;

            // Jika ada lonjakan nada/suara keras
            if (average > 0.18) { 
                let lane = Math.floor(Math.random() * 4);
                let time = i / sampleRate; 
                // Panjang tile disesuaikan dengan intensitas nada (100px - 220px)
                let length = Math.min(Math.max(average * 400, 80), 220); 

                // Mencegah tile terlalu berdempetan di jalur yang sama
                let lastTile = generatedTiles[generatedTiles.length - 1];
                if (!lastTile || (time - lastTile.time > 0.3)) {
                    generatedTiles.push({
                        lane: lane,
                        time: time,
                        length: length,
                        y: -length,
                        hit: false
                    });
                }
            }
        }
        return generatedTiles;
    }

    // 3. Start Game
    startBtn.addEventListener('click', () => {
        if (!audioBuffer) return;
        
        setupScreen.style.display = 'none';
        gameContainer.style.display = 'block';

        tiles = generateTilesFromAudio(audioBuffer);
        
        audioSource = audioCtx.createBufferSource();
        audioSource.buffer = audioBuffer;
        audioSource.connect(audioCtx.destination);
        
        startTime = audioCtx.currentTime;
        audioSource.start(0);
        isPlaying = true;

        requestAnimationFrame(gameLoop);
    });

    // 4. Controller Input (Tombol Panah)
    window.addEventListener('keydown', (e) => {
        if (keyMap.hasOwnProperty(e.key)) {
            let lane = keyMap[e.key];
            keyElements[e.key].classList.add('active');
            checkHit(lane);
        }
    });

    window.addEventListener('keyup', (e) => {
        if (keyMap.hasOwnProperty(e.key)) {
            keyElements[e.key].classList.remove('active');
        }
    });

    // 5. Cek Ketepatan Tekan (Hit Logic)
    function checkHit(lane) {
        const hitZoneY = 540; // Area tombol di bawah
        tiles.forEach(tile => {
            if (tile.lane === lane && !tile.hit) {
                // Toleransi area tekan
                if (tile.y + tile.length >= hitZoneY - 50 && tile.y <= hitZoneY + 50) {
                    tile.hit = true;
                    score += Math.floor(tile.length / 10); // Tile lebih panjang = skor lebih gede
                    document.getElementById('score').innerText = score;
                }
            }
        });
    }

    // 6. Game Loop (Render Canvas)
    function gameLoop() {
        if (!isPlaying) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Gambar Garis Pembatas Lane
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        for (let i = 1; i < 4; i++) {
            ctx.beginPath();
            ctx.moveTo(i * 90, 0);
            ctx.lineTo(i * 90, canvas.height);
            ctx.stroke();
        }

        let elapsedTime = audioCtx.currentTime - startTime;
        let speed = 400; // Kecepatan turun tile (px/detik)

        // Render & Update Posisi Tiles
        tiles.forEach(tile => {
            // Kalkulasi posisi Y berdasarkan waktu berjalan
            tile.y = (elapsedTime - tile.time) * speed;

            if (!tile.hit) {
                // Warna Tile (Gradient)
                let grad = ctx.createLinearGradient(0, tile.y, 0, tile.y + tile.length);
                grad.addColorStop(0, '#89b4fa');
                grad.addColorStop(1, '#b4befe');

                ctx.fillStyle = grad;
                // Gambar Tile dengan Sudut Membulat
                ctx.beginPath();
                ctx.roundRect(tile.lane * 90 + 5, tile.y, 80, tile.length, 8);
                ctx.fill();
            }
        });

        requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
