<title>Interactive Human Anatomy</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b0f14;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

/* HEADER */
header {
  text-align: center;
  padding: 25px 15px 10px;
}

header h1 {
  margin: 0;
  font-size: 28px;
  letter-spacing: 2px;
}

header p {
  color: #8e99a6;
  margin-top: 8px;
}

/* ANATOMY AREA */
.anatomy-container {
  position: relative;
  width: min(700px, 95vw);
  margin: 20px auto;
  border-radius: 20px;
  overflow: hidden;
  background: white;
  box-shadow:
    0 0 40px rgba(0,0,0,.6);
}

/* GAMBAR */
.anatomy-container img {
  width: 100%;
  display: block;
  transition: transform .8s ease;
}

/* EFEK HIDUP */
.anatomy-container.alive img {
  animation: breathing 5s ease-in-out infinite;
}

@keyframes breathing {

  0%,100% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.008);
  }

}

/* HOTSPOT */
.hotspot {

  position: absolute;

  width: 45px;
  height: 45px;

  transform: translate(-50%, -50%);

  border-radius: 50%;

  background: rgba(0, 200, 255, 0);

  border: 2px solid transparent;

  cursor: pointer;

  transition:
    .25s ease;

  z-index: 5;
}

.hotspot:hover {

  background: rgba(0, 200, 255, .25);

  border-color: #00d9ff;

  box-shadow:
    0 0 20px #00d9ff;

}

.hotspot.active {

  background: rgba(0, 220, 255, .35);

  border-color: #00e5ff;

  box-shadow:
    0 0 10px #00e5ff,
    0 0 30px #00e5ff;

  animation: selected .8s infinite alternate;

}

@keyframes selected {

  from {
    transform:
      translate(-50%, -50%)
      scale(1);
  }

  to {
    transform:
      translate(-50%, -50%)
      scale(1.15);
  }

}

/* INFO PANEL */

.info {

  position: fixed;

  left: 50%;
  bottom: 25px;

  transform:
    translate(-50%, 120px);

  width: min(400px, 90vw);

  padding: 18px;

  border-radius: 15px;

  background:
    rgba(12,18,25,.95);

  border:
    1px solid #00d9ff;

  box-shadow:
    0 0 30px rgba(0,220,255,.25);

  opacity: 0;

  transition: .4s ease;

  z-index: 100;

  backdrop-filter: blur(10px);
}

.info.show {

  transform:
    translate(-50%, 0);

  opacity: 1;

}

.info h2 {

  margin: 0 0 5px;

  color: #00dcff;

  font-size: 20px;

}

.info p {

  margin: 0;

  color: #c6ced7;

}

/* BUTTON */

.controls {

  text-align: center;

  margin: 20px;
}

button.control {

  background: #151d26;

  color: white;

  border: 1px solid #354454;

  border-radius: 10px;

  padding: 10px 18px;

  cursor: pointer;

  margin: 5px;

}

button.control:hover {

  border-color: #00d9ff;

  box-shadow:
    0 0 15px rgba(0,220,255,.3);

}

/* MOBILE */

@media(max-width:600px) {

  header h1 {
    font-size: 21px;
  }

  .hotspot {

    width: 35px;
    height: 35px;

  }

}
</style>
</head>
